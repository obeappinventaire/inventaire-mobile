<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Inventaire Chantier PWA</title>
  <link rel="icon" type="image/png" href="app_icon_co2h2o.png">
  <link rel="apple-touch-icon" href="app_icon_co2h2o.png">
  <meta name="theme-color" content="#f1f5f9">
  <link rel="manifest" href="manifest.json">

  <!-- SCRIPTS & CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/tesseract.js@v4.0.2/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>

  <style>
    /* Empêche le zoom au double-tap et les rebonds de l'écran */
    body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    button, input, select { touch-action: manipulation; }
    
    /* Force le centrage du texte dans les selects (Fix Safari/iOS) */
    select { text-align: center; text-align-last: center; }

    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="h-full text-slate-800 flex flex-col font-sans select-none antialiased bg-slate-100 overflow-hidden">

  <!-- BANDEAU MISE À JOUR PWA -->
  <div id="pwaUpdateBanner" class="hidden bg-orange-600 text-white px-4 py-2 text-xs flex items-center justify-between shrink-0 z-30 shadow-md">
    <span class="font-bold">🔄 Mise à jour détectée !</span>
    <button onclick="window.location.reload(true)" class="px-2.5 py-1 bg-white text-orange-700 font-bold rounded-lg text-[10px] shadow-2xs cursor-pointer">Appliquer</button>
  </div>

  <!-- EN-TÊTE MOBILE (HAUTEUR REDUITE) -->
  <header class="bg-slate-100 px-4 py-2.5 flex items-center justify-between shrink-0 z-20">
    <div class="flex items-end space-x-2.5 h-7">
      <img src="app_icon_co2h2o.png" alt="Logo" class="w-7 h-7 object-contain drop-shadow-sm">
      <h1 id="headerAgentName" class="text-base font-black text-black tracking-wide truncate max-w-[150px] leading-none pb-0.5">--</h1>
    </div>
    <div class="flex items-center space-x-3">
      <button id="syncBtn" onclick="syncMobileData()" title="Actualiser et Synchroniser" class="p-1.5 rounded-xl hover:bg-slate-200 transition cursor-pointer relative flex items-center justify-center">
        <i id="syncIcon" data-lucide="refresh-cw" class="w-5 h-5 text-emerald-600 transition-colors"></i>
        <span id="pendingBadge" class="hidden absolute -top-1 -right-1 bg-rose-600 text-white font-mono font-bold text-[9px] w-4 h-4 rounded-full flex items-center justify-center border border-slate-100">0</span>
      </button>
      <button onclick="openConfigModal()" title="Paramètres" class="p-1.5 rounded-xl text-slate-500 hover:bg-slate-200 transition cursor-pointer flex items-center justify-center">
        <i data-lucide="settings" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <!-- CONTENU PRINCIPAL (ESPACEMENT pb-[65vh] POUR REMONTER LA QUANTITÉ TOUT EN HAUT) -->
  <main class="flex-1 overflow-y-auto custom-scrollbar p-4 pb-[65vh]" id="mainScrollArea">
    
    <div class="space-y-4 h-full">
      <!-- ONGLET 1 : COMPTAGE -->
      <section id="tabComptage" class="flex flex-col justify-center min-h-[calc(100dvh-130px)] space-y-4">
        
        <!-- BANDEAU MISSION ACTIVE -->
        <div id="activeMissionBanner" class="hidden bg-white border border-slate-200 border-l-4 border-l-orange-500 p-3 rounded-xl shadow-sm space-y-1 relative shrink-0">
          <div class="flex justify-between items-center">
            <span class="text-[10px] font-black text-slate-500 uppercase tracking-wider flex items-center gap-1.5">
              <i data-lucide="target" class="w-3.5 h-3.5 text-orange-500"></i> Tâche Assignée
            </span>
            <button onclick="cancelActiveMission()" class="text-[9px] font-bold text-slate-400 hover:text-rose-600 bg-slate-50 hover:bg-rose-50 px-2 py-1 rounded-md transition cursor-pointer border border-slate-100">
              ✕ Quitter
            </button>
          </div>
          <p id="missionBannerInfo" class="text-xs font-bold text-slate-800 break-words whitespace-normal line-clamp-2">--</p>
        </div>

        <!-- PARAMÈTRES DE SAISIE -->
        <div class="bg-white border border-slate-200 p-4 rounded-2xl shadow-xs space-y-3 shrink-0">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-[10px] text-center font-bold text-slate-500 uppercase mb-1">Entrepreneur</label>
              <select id="selectContractor" onchange="updateBorderColor(this)" class="w-full text-center bg-slate-50 border-2 border-slate-300 rounded-xl p-2.5 text-xs font-bold text-slate-800 focus:outline-none focus:border-orange-500 focus:bg-white transition-colors shadow-sm"></select>
            </div>
            <div>
              <label class="block text-[10px] text-center font-bold text-slate-500 uppercase mb-1">Métier</label>
              <select id="selectTrade" onchange="updateBorderColor(this)" class="w-full text-center bg-slate-50 border-2 border-slate-300 rounded-xl p-2.5 text-xs font-bold text-slate-800 focus:outline-none focus:border-orange-500 focus:bg-white transition-colors shadow-sm"></select>
            </div>
          </div>
        </div>

        <!-- RECHERCHE ACTIVE -->
        <div class="bg-white border border-slate-200 p-4 rounded-2xl shadow-xs space-y-3 shrink-0" id="searchSection">
          <div class="relative" id="searchContainer">
            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
            
            <input type="text" id="sapSearchInput" onfocus="handleSearchFocus()" oninput="onSapSearchInput(this.value); updateBorderColor(this)" placeholder="Réf SAP ou libellé..." class="w-full bg-slate-50 border-2 border-slate-300 rounded-xl py-2.5 pl-9 pr-9 text-sm text-slate-800 font-bold focus:outline-none focus:border-orange-500 focus:bg-white transition-all shadow-sm">
            
            <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-2 top-2.5 text-slate-400 hover:text-slate-600 transition cursor-pointer bg-slate-100 rounded-full p-0.5">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>

            <div id="sapSuggestions" class="hidden absolute left-0 right-0 top-full mt-2 bg-white border border-slate-200 rounded-xl shadow-2xl z-30 max-h-80 overflow-y-auto custom-scrollbar p-1.5 space-y-1"></div>
          </div>

          <!-- ZONE DE SÉLECTION COMPACTE -->
          <div id="selectedArticleCard" class="hidden bg-emerald-50 border border-emerald-200 p-3 rounded-xl shadow-sm transition-all relative flex items-start gap-2.5 mt-2">
            <div class="bg-emerald-200 p-1 rounded-lg text-emerald-800 shrink-0 mt-0.5">
               <i data-lucide="check" class="w-3 h-3"></i>
            </div>
            <div class="flex-1 min-w-0 pr-6 flex flex-col justify-center">
               <div class="flex items-center gap-2 flex-wrap">
                 <span id="cardSapRef" class="font-mono font-bold text-emerald-900 text-sm break-words">--</span>
                 <span id="cardSupplierRef" class="font-mono text-[9px] font-bold text-emerald-700 bg-emerald-100 px-1.5 py-0.5 rounded border border-emerald-300 break-words line-clamp-1">--</span>
               </div>
               <p id="cardDesignation" class="text-xs text-slate-700 break-words whitespace-normal leading-snug mt-1">--</p>
            </div>
            <button onclick="clearSearch()" class="absolute top-2 right-2 p-1.5 text-emerald-600 hover:text-emerald-800 hover:bg-emerald-200 rounded-full transition cursor-pointer" title="Annuler la sélection">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>

          <!-- BOUTONS SANS TEXTE -->
          <div class="grid grid-cols-2 gap-3 pt-1">
            <button onclick="toggleVoiceSearch()" id="micBtn" class="h-14 bg-slate-50 border border-slate-200 hover:bg-slate-100 rounded-2xl flex items-center justify-center transition cursor-pointer shadow-sm">
              <i data-lucide="mic" class="w-6 h-6 text-indigo-500"></i>
            </button>
            <button onclick="openScanModal()" class="h-14 bg-orange-300 border border-orange-400 hover:bg-orange-400 rounded-2xl flex items-center justify-center transition cursor-pointer shadow-md">
              <i data-lucide="camera" class="w-6 h-6 text-orange-900"></i>
            </button>
          </div>
        </div>

        <!-- QUANTITÉ COMPTÉE & ENREGISTREMENT -->
        <div class="bg-white border border-slate-200 p-4 rounded-2xl shadow-xs space-y-4 shrink-0" id="quantitySection">
          <div class="relative w-full">
            <input type="number" id="inputQuantity" oninput="updateBorderColor(this)" placeholder="0" min="0" onfocus="handleQuantityFocus()" class="w-full h-16 text-center font-black text-3xl bg-slate-50 border-2 border-slate-300 rounded-2xl focus:outline-none focus:border-emerald-400 focus:bg-emerald-50 focus:text-emerald-800 font-mono shadow-inner transition-all">
          </div>

          <button onclick="submitInventoryEntry()" class="w-full h-14 bg-emerald-200 hover:bg-emerald-300 active:bg-emerald-400 rounded-2xl shadow-md flex items-center justify-center transition cursor-pointer border border-emerald-300">
            <i data-lucide="check-square" class="w-7 h-7 text-emerald-900"></i>
          </button>
        </div>
      </section>

      <!-- ONGLET 2 : HISTORIQUE -->
      <section id="tabHistorique" class="hidden space-y-3">
        <div class="flex justify-between items-center px-1">
          <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Saisies de la session</h2>
          <span id="historyCount" class="text-xs font-mono font-bold text-emerald-700">0 ligne(s)</span>
        </div>
        <div id="historyListContainer" class="space-y-3"></div>
      </section>

      <!-- ONGLET 3 : LA FILE D'ATTENTE (MISSIONS GROUPÉES) -->
      <section id="tabTournee" class="hidden space-y-4">
        <!-- Remplacement de l'en-tête par un KPI dynamique -->
        <div id="tourneeDebugHeader" class="pb-2 border-b border-slate-200"></div>
        <div id="tourneeListContainer" class="space-y-3 pb-8"></div>
      </section>
    </div>

  </main>

  <!-- BARRE DE NAVIGATION INFÉRIEURE -->
  <nav class="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-4 py-1.5 flex justify-around items-center z-20 shadow-lg pb-safe">
    <button onclick="switchMobileTab('comptage')" id="navComptage" class="flex flex-col items-center space-y-0.5 text-emerald-600 font-bold text-[9px] transition cursor-pointer">
      <i data-lucide="calculator" class="w-4 h-4"></i>
      <span>Comptage</span>
    </button>
    <button onclick="switchMobileTab('historique')" id="navHistorique" class="flex flex-col items-center space-y-0.5 text-slate-400 font-bold text-[9px] transition cursor-pointer">
      <i data-lucide="history" class="w-4 h-4"></i>
      <span>Historique</span>
    </button>
    <button onclick="switchMobileTab('tournee')" id="navTournee" class="flex flex-col items-center space-y-0.5 text-slate-400 font-bold text-[9px] transition cursor-pointer">
      <i data-lucide="route" class="w-4 h-4"></i>
      <span>Ma Tournée</span>
    </button>
  </nav>

  <!-- MODALE SCAN CAMÉRA -->
  <div id="scanModal" class="fixed inset-0 bg-black z-50 flex flex-col hidden">
    <!-- Vidéo plein écran -->
    <div class="relative flex-1 w-full flex items-center justify-center overflow-hidden bg-black">
      <video id="scanVideo" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover"></video>
      <div class="absolute inset-x-8 top-1/2 -translate-y-1/2 h-0.5 bg-orange-400/80 animate-pulse shadow-sm"></div>
      <div id="ocrStatus" class="absolute top-10 left-1/2 -translate-x-1/2 text-center text-xs text-white font-mono bg-slate-900/60 px-4 py-1.5 rounded-full backdrop-blur-md">Prêt pour la capture</div>
    </div>
    
    <!-- Dock de contrôle inférieur -->
    <div class="h-32 bg-slate-950 pb-8 pt-4 px-8 flex items-center justify-between shrink-0">
      <button onclick="closeScanModal()" class="w-14 h-14 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-white active:scale-95 transition shadow-lg cursor-pointer">
        <i data-lucide="x" class="w-6 h-6"></i>
      </button>
      
      <button onclick="captureAndOCR()" class="w-20 h-20 bg-orange-500 hover:bg-orange-400 active:scale-95 rounded-full shadow-[0_0_20px_rgba(249,115,22,0.4)] border-4 border-orange-200 transition flex items-center justify-center cursor-pointer">
        <i data-lucide="camera" class="w-8 h-8 text-white"></i>
      </button>
      
      <div class="w-14 h-14"></div>
    </div>
    <canvas id="scanCanvas" class="hidden"></canvas>
  </div>

  <!-- MODALE CONFIGURATION PROFIL & SUPPORT -->
  <div id="configModal" class="fixed inset-0 bg-slate-900/40 z-50 flex items-center justify-center p-4 backdrop-blur-sm hidden">
    <div class="bg-white border border-slate-200 w-full max-w-sm rounded-[32px] p-6 shadow-2xl text-center flex flex-col gap-4">
      <div>
        <div class="w-12 h-12 bg-orange-50 text-orange-500 rounded-2xl flex items-center justify-center mx-auto mb-2 shadow-inner border border-orange-100">
          <i data-lucide="user-cog" class="w-6 h-6"></i>
        </div>
        <h2 class="text-xl font-black text-slate-900 tracking-tight">Profil Collaborateur</h2>
      </div>
      
      <div class="text-left">
        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1.5 ml-1">Agent de terrain</label>
        <div class="relative">
          <select id="configAgentSelect" class="w-full text-center bg-slate-50 border-2 border-slate-200 rounded-2xl h-14 pl-4 pr-10 text-sm font-bold text-slate-800 appearance-none focus:outline-none focus:border-emerald-500 focus:bg-white transition-colors shadow-sm cursor-pointer"></select>
          <i data-lucide="chevron-down" class="w-5 h-5 absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
        </div>
      </div>
      
      <div class="space-y-2.5">
        <button onclick="saveAgentConfig()" class="w-full h-12 bg-orange-400 hover:bg-orange-500 active:bg-orange-600 text-white font-bold rounded-2xl text-sm shadow-lg transition-all flex items-center justify-center gap-2 cursor-pointer">
          <i data-lucide="user-check" class="w-5 h-5"></i> Activer ce profil
        </button>
        <button onclick="logoutMobileAgentStep1()" class="w-full h-12 bg-white border-2 border-slate-200 hover:bg-slate-50 text-slate-600 font-bold rounded-2xl text-sm transition-all flex items-center justify-center gap-2 cursor-pointer shadow-sm">
          <i data-lucide="log-out" class="w-4 h-4 text-slate-400"></i> Se déconnecter
        </button>
      </div>

      <hr class="border-slate-100 my-1">

      <div class="space-y-2.5">
        <button onclick="sendSupportEmail()" class="w-full h-12 bg-indigo-50 border border-indigo-200 text-indigo-700 hover:bg-indigo-100 active:scale-95 font-bold rounded-2xl text-sm transition-all flex items-center justify-center gap-2 shadow-sm cursor-pointer">
          <i data-lucide="mail" class="w-5 h-5"></i> Support & Feedback
        </button>
        <button id="btnHardReset" onclick="hardResetApp()" class="w-full h-12 bg-rose-50 border border-rose-200 text-rose-700 hover:bg-rose-100 active:scale-95 font-bold rounded-2xl text-sm transition-all flex items-center justify-center gap-2 shadow-sm cursor-pointer">
          <i data-lucide="rotate-cw" class="w-5 h-5"></i> Dépannage système
        </button>
      </div>
      
      <!-- COPYRIGHT DÉPLACÉ ICI -->
      <div class="mt-2 text-center">
        <span class="text-[8px] font-medium text-slate-300 tracking-widest uppercase">&copy; made by CO2H2O srlu</span>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').then(reg => {
          reg.onupdatefound = () => {
            const installing = reg.installing;
            installing.onstatechange = () => {
              if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                document.getElementById("pwaUpdateBanner").classList.remove("hidden");
              }
            };
          };
        }).catch(err => {
          console.warn('SW error:', err);
        });
      });
    }

    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbysSqcdAtUIWYj9YUmxKTt2W9PvcsoLBig2SikCANNQL1Sr3wkn0qbNn9GYQugM1uje/exec";

    let currentAgent = localStorage.getItem("mob_current_agent") || "";
    let catalog = [];
    let availableAgents = [];
    let availableContractors = [];
    let availableTrades = [];
    let cachedTournees = [];
    let pendingSyncQueue = [];
    let sessionHistory = [];
    let isSyncing = false; 
    let openTourneeGroups = {}; 

    // --- ENVOI D'EMAIL SUPPORT NATIF ---
    function sendSupportEmail() {
      const agent = currentAgent || "Non_renseigne";
      const subject = encodeURIComponent(`[Support] Application Inventaire - Agent: ${agent}`);
      const body = encodeURIComponent(
`Bonjour l'équipe,

Voici ma demande (Bug / Amélioration) :



---
Infos techniques (ne pas modifier) :
Agent : ${agent}
Date : ${new Date().toLocaleString('fr-FR')}
Version Web App : v4.0`
      );
      window.location.href = `mailto:support@votredomaine.com?subject=${subject}&body=${body}`;
    }

    // --- DÉTECTEUR DOUBLE TAP GLOBAL POUR RETOUR À ZERO ---
    let lastTouchTime = 0;
    document.body.addEventListener('touchstart', function(e) {
      if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.closest('button') || e.target.closest('.custom-scrollbar')) {
        return;
      }
      const currentTime = new Date().getTime();
      const tapLength = currentTime - lastTouchTime;
      if (tapLength < 300 && tapLength > 50) {
        switchMobileTab('comptage');
        resetComptageForm();
        document.getElementById('mainScrollArea').scrollTo({ top: 0, behavior: 'smooth' });
        if (document.activeElement) {
          document.activeElement.blur();
        }
        e.preventDefault();
      }
      lastTouchTime = currentTime;
    }, { passive: false });

    async function safeSetStorage(key, data) { 
      try { 
        await localforage.setItem(key, data); 
      } catch (e) { 
        console.warn("Stockage saturé ou erreur IndexedDB."); 
      } 
    }

    let selectedArticle = null;
    let activeMissionContext = null;
    let currentGpsCoords = { lat: null, lng: null };
    let mediaStream = null;
    let barcodeDetector = null;
    let scanLoopActive = false;

    function updateBorderColor(el) {
      if(!el) return;
      if (el.value && String(el.value).trim() !== "") {
        el.classList.remove('border-slate-200', 'border-slate-300');
        el.classList.add('border-orange-500');
      } else {
        el.classList.remove('border-orange-500');
        el.classList.add('border-slate-300');
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      lucide.createIcons();
      
      catalog = (await localforage.getItem("offline_catalog")) || [];
      availableAgents = (await localforage.getItem("offline_agents")) || [];
      availableContractors = (await localforage.getItem("offline_contractors")) || [];
      availableTrades = (await localforage.getItem("offline_trades")) || [];
      cachedTournees = (await localforage.getItem("offline_tournees")) || [];
      pendingSyncQueue = (await localforage.getItem("offline_pending_sync")) || [];
      sessionHistory = (await localforage.getItem("mob_session_history")) || [];

      initMobileDropdowns();
      updatePendingBadge();
      
      if (!currentAgent) {
        document.getElementById("configModal").classList.remove("hidden");
      } else {
        document.getElementById("headerAgentName").innerText = currentAgent;
      }

      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(pos => { 
          currentGpsCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude }; 
        }, err => {}, { enableHighAccuracy: true });
      }
      
      if ('BarcodeDetector' in window) { 
        try { 
          barcodeDetector = new BarcodeDetector({ formats: ['code_128', 'ean_13', 'ean_8', 'qr_code'] }); 
        } catch (e) {} 
      }

      renderHistory(); 
      renderTournee(); 
      await syncMobileData();
    });

    async function hardResetApp() {
      if (!confirm("⚠️ Attention : Cette action va vider le cache et forcer le retéléchargement complet de l'application. Continuer ?")) {
        return;
      }
      document.getElementById("btnHardReset").innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Nettoyage...';
      try {
        await localforage.clear(); 
        localStorage.clear(); 
        sessionStorage.clear();
        if ('caches' in window) { 
          const keys = await caches.keys(); 
          for (let k of keys) {
            await caches.delete(k);
          }
        }
        if ('serviceWorker' in navigator) { 
          const regs = await navigator.serviceWorker.getRegistrations(); 
          for (let r of regs) {
            await r.unregister();
          }
        }
      } catch (e) {
        console.warn(e);
      }
      window.location.href = window.location.pathname + '?reset=' + Date.now();
    }

    function initMobileDropdowns() {
      const agentSel = document.getElementById("configAgentSelect");
      if (agentSel) {
        if (availableAgents.length > 0) {
          agentSel.innerHTML = '<option value="">-- Choisir votre profil --</option>' + availableAgents.map(a => `<option value="${a}">${a}</option>`).join('');
          if (currentAgent) {
            agentSel.value = currentAgent;
          }
        } else {
          agentSel.innerHTML = '<option value="">⏳ Synchronisation en cours...</option>';
        }
      }
      
      const cSel = document.getElementById("selectContractor");
      const tSel = document.getElementById("selectTrade");
      if (cSel && availableContractors.length > 0) {
        cSel.innerHTML = availableContractors.map(c => `<option value="${c}">${c}</option>`).join('');
      }
      if (tSel && availableTrades.length > 0) {
        tSel.innerHTML = availableTrades.map(t => `<option value="${t}">${t}</option>`).join('');
      }
    }

    function setSelectValueWithFallback(selectId, val) {
      const sel = document.getElementById(selectId); 
      if (!sel || !val) return;
      const targetVal = String(val).trim(); 
      let found = false;
      for (let i = 0; i < sel.options.length; i++) { 
        if (sel.options[i].value.trim().toLowerCase() === targetVal.toLowerCase()) { 
          sel.selectedIndex = i; 
          found = true; 
          break; 
        } 
      }
      if (!found) { 
        const opt = document.createElement("option"); 
        opt.value = targetVal; 
        opt.textContent = targetVal; 
        opt.selected = true; 
        sel.appendChild(opt); 
      }
      updateBorderColor(sel);
    }

    function openConfigModal() { 
      document.getElementById("configModal").classList.remove("hidden"); 
    }

    function saveAgentConfig() {
      const sel = document.getElementById("configAgentSelect").value;
      if (!sel) { 
        alert("Sélectionnez un profil."); 
        return; 
      }
      currentAgent = sel; 
      localStorage.setItem("mob_current_agent", currentAgent);
      document.getElementById("headerAgentName").innerText = currentAgent;

    function normalizeDateYMD(dateVal) {
      if (!dateVal) return "";
      if (dateVal instanceof Date) {
        return `${dateVal.getFullYear()}-${String(dateVal.getMonth()+1).padStart(2,'0')}-${String(dateVal.getDate()).padStart(2,'0')}`;
      }
      const str = String(dateVal).trim().replace(/['"]/g, ''); 
      if (str.includes('T')) {
        return str.split('T')[0];
      }
      const parts = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
      if (parts) {
        return `${parts[3]}-${String(parts[2]).padStart(2,'0')}-${String(parts[1]).padStart(2,'0')}`;
      }
      return str.split(' ')[0];
    }

    async function syncMobileData() {
      if (!navigator.onLine || isSyncing) return;
      isSyncing = true;
      
      const syncIcon = document.getElementById("syncIcon");
      const syncBtn = document.getElementById("syncBtn");
      
      if (syncIcon) {
         syncIcon.classList.remove("text-emerald-600");
         syncIcon.classList.add("text-orange-500", "animate-spin");
      }
      if (syncBtn) syncBtn.classList.add("opacity-70", "pointer-events-none");

      let recentlyProcessedHistory = [];
      let recentlyProcessedTourneeUpdates = [];

      if (pendingSyncQueue.length > 0) {
        const queueCopy = [...pendingSyncQueue];
        for (const item of queueCopy) {
          if (item.action === "CREATE") {
            recentlyProcessedHistory.push(item);
          }
          if (item.action === "UPDATE_TOURNEE_STATUS") {
            recentlyProcessedTourneeUpdates.push(item);
          }
          try {
            await fetch(GOOGLE_SCRIPT_URL, { 
              method: "POST", 
              headers: { "Content-Type": "text/plain;charset=utf-8" }, 
              body: JSON.stringify(item) 
            });
            pendingSyncQueue = pendingSyncQueue.filter(q => q._syncId !== item._syncId);
            await safeSetStorage("offline_pending_sync", pendingSyncQueue);
          } catch (err) { 
            break; 
          }
        }
        updatePendingBadge();
      }

      try {
        const res = await fetch(`${GOOGLE_SCRIPT_URL}?t=${Date.now()}`, { cache: "no-store" }); 
        const data = await res.json();
        
        if (data.status === "success") {
          if (data.catalog) { 
            catalog = data.catalog; 
            await safeSetStorage("offline_catalog", catalog); 
          }
          if (data.agents) { 
            availableAgents = data.agents; 
            await safeSetStorage("offline_agents", availableAgents); 
          }
          if (data.contractors) { 
            availableContractors = data.contractors; 
            await safeSetStorage("offline_contractors", availableContractors); 
          }
          if (data.trades) { 
            availableTrades = data.trades; 
            await safeSetStorage("offline_trades", availableTrades); 
          }
          
          if (data.tournees) {
            let pendingUpdatesToMerge = [...recentlyProcessedTourneeUpdates];
            pendingSyncQueue.forEach(q => { 
              if (q.action === "UPDATE_TOURNEE_STATUS") pendingUpdatesToMerge.push(q); 
            });
            
            const localValides = new Set(cachedTournees.filter(t => String(t.statut).trim().toUpperCase() === 'VALIDE').map(t => String(t.id)));
            
            pendingUpdatesToMerge.forEach(pu => { 
              if (String(pu.statut).trim().toUpperCase() === 'VALIDE') localValides.add(String(pu.id)); 
            });
            
            cachedTournees = data.tournees.map(s => localValides.has(String(s.id)) ? { ...s, statut: 'VALIDE' } : s);
            await safeSetStorage("offline_tournees", cachedTournees);
          }
          
          if (data.history) {
            const nA = String(currentAgent || "").trim().toLowerCase();
            let serverHistory = data.history.filter(h => String(h.user || "").trim().toLowerCase() === nA);
            let pendingHistToMerge = [...recentlyProcessedHistory];
            pendingSyncQueue.forEach(q => { 
              if (q.action === "CREATE") pendingHistToMerge.push(q); 
            });
            pendingHistToMerge.forEach(ph => { 
              if (!serverHistory.find(sh => sh.id === ph.id)) {
                serverHistory.unshift(ph);
              }
            });
            sessionHistory = serverHistory; 
            await safeSetStorage("mob_session_history", sessionHistory);
          }
          initMobileDropdowns(); 
          renderTournee(); 
          renderHistory();
        }
      } catch (err) {
        console.warn("Background sync error", err);
      } finally {
        isSyncing = false;
        
        if (syncIcon) {
           syncIcon.classList.remove("text-orange-500", "animate-spin");
           syncIcon.classList.add("text-emerald-600");
        }
        if (syncBtn) syncBtn.classList.remove("opacity-70", "pointer-events-none");
      }
    }

    async function openScanModal() {
      if (navigator.vibrate) navigator.vibrate(40);
      document.getElementById("scanModal").classList.remove("hidden"); 
      document.getElementById("ocrStatus").innerText = "Initialisation...";
      try { 
        mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } }); 
        document.getElementById("scanVideo").srcObject = mediaStream; 
        document.getElementById("ocrStatus").innerText = barcodeDetector ? "Scan automatique..." : "Cadrez"; 
        scanLoopActive = true; 
        if (barcodeDetector) {
          requestAnimationFrame(detectBarcodeLoop);
        }
      } catch (err) { 
        document.getElementById("ocrStatus").innerText = "Erreur: " + err.message; 
      }
    }
    
    async function detectBarcodeLoop() {
      if (!scanLoopActive) return; 
      const v = document.getElementById("scanVideo");
      if (v.readyState === v.HAVE_ENOUGH_DATA && barcodeDetector) { 
        try { 
          const b = await barcodeDetector.detect(v); 
          if (b.length > 0) { 
            const i = catalog.find(x => String(x.sapRef).trim() === b[0].rawValue || String(x.ean).trim() === b[0].rawValue); 
            if (i) {
              selectArticleFromSearch(i);
              closeScanModal();
              return;
            } 
          } 
        } catch (e) {
        } 
      }
      requestAnimationFrame(detectBarcodeLoop);
    }
    
    function closeScanModal() { 
      scanLoopActive = false; 
      if (mediaStream) {
        mediaStream.getTracks().forEach(t => t.stop());
        mediaStream = null;
      } 
      document.getElementById("scanModal").classList.add("hidden"); 
    }

    async function captureAndOCR() {
      if (navigator.vibrate) navigator.vibrate(40);
      
      const v = document.getElementById("scanVideo");
      const c = document.getElementById("scanCanvas"); 
      if (!v.srcObject) return;
      
      c.width = v.videoWidth || 640; 
      c.height = v.videoHeight || 480; 
      c.getContext('2d').drawImage(v, 0, 0, c.width, c.height); 
      document.getElementById("ocrStatus").innerText = "OCR en cours...";
      
      try {
        const res = await Tesseract.recognize(c, 'fra'); 
        const m = res.data.text.match(/\b[A-Z0-9]{4,12}\b/gi);
        if (m && m.length > 0) { 
          const i = catalog.find(x => String(x.sapRef).trim().toUpperCase() === m[0].toUpperCase()); 
          if (i) {
            selectArticleFromSearch(i);
            closeScanModal();
          } else {
            document.getElementById("ocrStatus").innerText = "Introuvable";
          }
        } else {
          document.getElementById("ocrStatus").innerText = "Aucun code";
        }
      } catch (err) { 
        document.getElementById("ocrStatus").innerText = "Erreur: " + err.message; 
      }
    }

    function renderHistory() {
      const container = document.getElementById("historyListContainer"); 
      if (!container) return;
      
      const agentLower = String(currentAgent || "").trim().toLowerCase();
      const now = new Date(); 
      const ARCHIVE_LIMIT_MS = 3 * 60 * 60 * 1000;
      const threeHoursAgo = new Date(now.getTime() - ARCHIVE_LIMIT_MS);
      
      const sessionHist = sessionHistory.filter(h => String(h.user).toLowerCase() === agentLower); 
      const pendingIds = new Set(sessionHist.map(h => h.id));
      
      const pendingFiltered = pendingSyncQueue
        .filter(p => p.action === 'CREATE' && String(p.user).toLowerCase() === agentLower && !pendingIds.has(p.id))
        .map(p => ({ ...p, isPending: true }));

      let fullHistory = [...pendingFiltered, ...sessionHist].filter(h => { 
        const histDate = new Date(h.timestamp); 
        return histDate >= threeHoursAgo; 
      });

      fullHistory.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      
      const countLabel = document.getElementById("historyCount");
      if (countLabel) countLabel.innerText = `${fullHistory.length} ligne(s)`;
      
      if (fullHistory.length === 0) { 
        container.innerHTML = `<div class="p-8 text-center text-slate-400 italic text-sm bg-white rounded-2xl shadow-sm border border-slate-200"><p class="font-bold text-slate-500">Aucune saisie récente.</p></div>`; 
        return; 
      }
      
      let html = '';
      fullHistory.forEach(h => {
        const isPending = h.isPending;
        const borderClass = isPending ? 'border-amber-400 bg-amber-50/50' : 'border-slate-200';
        const statusBadge = isPending 
            ? '<span class="px-1.5 py-0.5 rounded text-[9px] font-bold bg-amber-100 text-amber-800 border border-amber-300 shadow-xs">⏳ ATTENTE</span>'
            : '<span class="px-1.5 py-0.5 rounded text-[9px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-200 shadow-xs">✓ ENREGISTRÉ</span>';
        
        const histDate = new Date(h.timestamp);
        const timeStr = histDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        const ageMs = now.getTime() - histDate.getTime();
        const remainingMs = ARCHIVE_LIMIT_MS - ageMs;
        const remainingMins = Math.max(0, Math.floor(remainingMs / (60 * 1000)));
        let archiveText = "";
        if (remainingMins > 60) {
           archiveText = `Archivage dans ${Math.floor(remainingMins/60)}h${String(remainingMins%60).padStart(2,'0')}`;
        } else {
           archiveText = `Archivage dans ${remainingMins} min`;
        }

        html += `
          <div class="bg-white border ${borderClass} p-4 rounded-3xl shadow-sm space-y-3 text-xs cursor-default select-none transition-all">
            <div class="flex items-center justify-between gap-2 border-b border-slate-100 pb-2">
              <div class="flex items-center gap-2">
                <span class="font-mono font-black text-orange-800 text-sm break-words">${h.sapRef}</span>
                ${statusBadge}
              </div>
              <div class="flex flex-col items-end shrink-0">
                <span class="text-[10px] font-bold text-slate-600 flex items-center gap-1">
                  <i data-lucide="clock" class="w-3 h-3"></i> ${timeStr}
                </span>
                <span class="text-[8px] text-slate-400 font-semibold tracking-wider uppercase mt-0.5 whitespace-nowrap">${archiveText}</span>
              </div>
            </div>
            <p class="font-bold text-slate-900 text-sm leading-tight break-words whitespace-normal">${h.designation}</p>
            
            <div class="flex gap-2 pt-1 items-stretch flex-wrap">
              <div class="bg-slate-100 text-slate-700 px-3 py-2 rounded-xl shadow-inner border border-slate-200 flex flex-col justify-center flex-1 min-w-[120px]">
                <span class="text-xs font-bold text-slate-800 break-words whitespace-normal">${h.contractor}</span>
                <span class="text-[10px] font-semibold text-slate-500 break-words whitespace-normal">${h.trade}</span>
              </div>
              
              <div class="flex gap-2 shrink-0">
                <div class="bg-emerald-100 text-emerald-800 px-3 py-2 rounded-xl text-base font-black font-mono shadow-inner border border-emerald-200 flex justify-center items-center">
                  ${h.quantity} <span class="text-[10px] ml-1 opacity-70">PCS</span>
                </div>
                <button onclick="editHistoryItem('${h.id}')" class="px-3 py-2 rounded-xl bg-white hover:bg-slate-50 text-slate-700 shadow-sm border border-slate-200 active:scale-95 transition-transform flex items-center justify-center shrink-0">
                  <i data-lucide="edit-3" class="w-5 h-5"></i>
                </button>
                <button onclick="deleteHistoryItem('${h.id}')" class="px-3 py-2 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 shadow-sm border border-rose-200 active:scale-95 transition-transform flex items-center justify-center shrink-0">
                  <i data-lucide="trash-2" class="w-5 h-5"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      });

      html += `<div class="text-center text-[10px] text-slate-400 mt-5 pb-2 px-4 leading-snug">Les saisies vieilles de plus de 3 heures sont archivées de votre vue pour libérer de l'espace sur l'appareil.</div>`;

      container.innerHTML = html;
      lucide.createIcons();
    }

    async function editHistoryItem(id) {
      if (navigator.vibrate) navigator.vibrate(40); 
      
      const item = sessionHistory.find(h => h.id === id); 
      if (!item) return; 
      
      const qtyPrompt = prompt("Modifier la quantité :", item.quantity); 
      if (qtyPrompt === null) return; 
      
      const newQty = parseInt(qtyPrompt, 10); 
      if (isNaN(newQty) || newQty < 0) return;
      
      item.quantity = newQty; 
      await safeSetStorage("mob_session_history", sessionHistory);
      
      const pendingCreate = pendingSyncQueue.find(x => x.id === id && x.action === 'CREATE'); 
      if (pendingCreate) {
        pendingCreate.quantity = newQty; 
      } else { 
        const syncId = "SYNC-" + Date.now().toString(36) + Math.random().toString(36).substring(2); 
        pendingSyncQueue.push({
          _syncId: syncId, 
          action: "UPDATE_INVENTORY", 
          id: id, 
          quantity: newQty, 
          user: currentAgent
        }); 
      }
      
      await safeSetStorage("offline_pending_sync", pendingSyncQueue); 
      updatePendingBadge(); 
      renderHistory(); 
      
      if (navigator.onLine) {
        syncMobileData();
      }
    }

    async function deleteHistoryItem(id) {
      if (navigator.vibrate) navigator.vibrate(40); 
      
      if (!confirm("Supprimer cette saisie ?")) return;
      
      const item = sessionHistory.find(h => h.id === id); 
      sessionHistory = sessionHistory.filter(h => h.id !== id); 
      await safeSetStorage("mob_session_history", sessionHistory);
      
      const pendingIndex = pendingSyncQueue.findIndex(x => x.id === id && x.action === 'CREATE'); 
      if (pendingIndex !== -1) {
        pendingSyncQueue.splice(pendingIndex, 1); 
      } else { 
        const syncId = "SYNC-" + Date.now().toString(36) + Math.random().toString(36).substring(2); 
        pendingSyncQueue.push({
          _syncId: syncId, 
          action: "DELETE_INVENTORY", 
          id: id, 
          user: currentAgent
        }); 
      }
      
      if (item && item.tourneeId) { 
        const syncId = "SYNC-" + Date.now().toString(36) + Math.random().toString(36).substring(2); 
        pendingSyncQueue.push({
          _syncId: syncId, 
          action: "UPDATE_TOURNEE_STATUS", 
          id: item.tourneeId, 
          statut: 'A_FAIRE', 
          user: currentAgent
        }); 
        
        const tourneeTask = cachedTournees.find(x => x.id === item.tourneeId); 
        if (tourneeTask) {
          tourneeTask.statut = 'A_FAIRE'; 
        }
        await safeSetStorage("offline_tournees", cachedTournees); 
      }
      
      await safeSetStorage("offline_pending_sync", pendingSyncQueue); 
      updatePendingBadge(); 
      renderHistory(); 
      renderTournee(); 
      
      if (navigator.onLine) {
        syncMobileData();
      }
    }

    function formatTourneeDate(dStr) {
      if (!dStr) return "Aucune date";
      const parts = dStr.split('-');
      if (parts.length === 3) {
        const d = new Date(parts[0], parts[1] - 1, parts[2]);
        if (!isNaN(d.getTime())) {
          return `${['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'][d.getDay()]} ${d.getDate()} ${['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'][d.getMonth()]}`;
        }
      }
      return dStr;
    }

    function toggleTourneeGroup(groupId) {
      openTourneeGroups[groupId] = !openTourneeGroups[groupId];
      renderTournee();
    }

    function buildTourneeGroups(tourneesList) {
      const groupsMap = {};
      tourneesList.forEach(t => {
        const key = `${t.date}_${t.contractor}_${t.trade}_${t.tranche}`;
        if (!groupsMap[key]) {
          groupsMap[key] = {
            id: key.replace(/[^a-zA-Z0-9]/g, '_'),
            date: t.date,
            tranche: t.tranche,
            contractor: t.contractor,
            trade: t.trade,
            items: []
          };
        }
        groupsMap[key].items.push(t);
      });

      const list = Object.values(groupsMap);
      list.forEach(g => {
        g.items.sort((a, b) => (Number(a.ordre) || 0) - (Number(b.ordre) || 0));
        g.total = g.items.length;
        g.done = g.items.filter(i => String(i.statut).trim().toUpperCase() === 'VALIDE').length;
        g.pending = g.total - g.done;
        g.statut = g.pending === 0 ? 'VALIDE' : 'A_FAIRE';
      });
      return list;
    }

    function renderTournee() {
      const c = document.getElementById("tourneeListContainer"); 
      const tHeader = document.getElementById("tourneeDebugHeader");
      if (!c) return; 
      
      const agentTournees = (cachedTournees || []).filter(t => String(t.agent || "").trim().toLowerCase() === String(currentAgent || "").trim().toLowerCase());
      
      if (tHeader) {
        const totalT = agentTournees.length;
        const doneT = agentTournees.filter(t => String(t.statut).trim().toUpperCase() === 'VALIDE').length;
        const remainingT = totalT - doneT;

        tHeader.innerHTML = `
          <div class="flex gap-2 w-full pt-1">
            <div class="flex-1 bg-orange-50 text-orange-800 px-3 py-2.5 rounded-2xl border border-orange-200 flex flex-col items-center justify-center shadow-sm">
              <span class="text-xl font-black leading-none">${remainingT}</span>
              <span class="text-[9px] font-bold uppercase mt-1 opacity-80">À traiter</span>
            </div>
            <div class="flex-1 bg-slate-50 text-slate-600 px-3 py-2.5 rounded-2xl border border-slate-200 flex flex-col items-center justify-center shadow-sm">
              <span class="text-xl font-black leading-none">${totalT}</span>
              <span class="text-[9px] font-bold uppercase mt-1 opacity-80">Au Total</span>
            </div>
          </div>
        `;
      }

      const groupedTasks = buildTourneeGroups(agentTournees);
      const safeSort = (a, b) => normalizeDateYMD(a.date).localeCompare(normalizeDateYMD(b.date));
      const todayStr = normalizeDateYMD(new Date());

      const aTraiter = groupedTasks.filter(g => g.statut !== 'VALIDE').sort(safeSort);
      const terminees = groupedTasks.filter(g => g.statut === 'VALIDE' && normalizeDateYMD(g.date) >= todayStr).sort(safeSort);

      let html = '';

      const renderCard = (g, isDone) => {
        const isOpen = !!openTourneeGroups[g.id];
        const dateStr = formatTourneeDate(g.date);
        
        let cardHtml = `
          <div class="bg-white border ${isDone ? 'border-emerald-300 bg-emerald-50/20' : 'border-slate-200'} rounded-3xl shadow-sm flex flex-col transition-all overflow-hidden mb-4">
            
            <div onclick="toggleTourneeGroup('${g.id}')" class="p-4 cursor-pointer active:bg-slate-50 transition-colors">
              <div class="flex items-center justify-between gap-2 border-b border-slate-100 pb-2 mb-3">
                <div class="flex items-center gap-2">
                  <i data-lucide="calendar" class="w-4 h-4 text-slate-400"></i>
                  <span class="font-bold text-slate-700 text-xs uppercase">${dateStr} - ${g.tranche || 'MATIN'}</span>
                </div>
                ${isDone 
                  ? '<i data-lucide="check-circle" class="w-5 h-5 text-emerald-500"></i>' 
                  : '<i data-lucide="clock-4" class="w-5 h-5 text-amber-500"></i>'}
              </div>
              
              <div class="flex items-center justify-between mb-3">
                <div class="flex-1 min-w-0 flex flex-col justify-center">
                  <p class="font-black text-slate-900 text-sm leading-tight break-words whitespace-normal">${g.contractor}</p>
                  <p class="text-[11px] font-bold text-orange-600 break-words whitespace-normal mt-0.5">${g.trade}</p>
                </div>
                <div class="shrink-0 ml-3 bg-slate-50 p-1.5 rounded-full text-slate-400 border border-slate-100 shadow-sm">
                   <i data-lucide="${isOpen ? 'chevron-up' : 'chevron-down'}" class="w-5 h-5"></i>
                </div>
              </div>
              
              <div class="flex gap-3 items-stretch">
                <div class="bg-slate-100 text-slate-700 px-3 py-1.5 rounded-2xl text-sm font-black shadow-inner border border-slate-200 flex-1 flex flex-col justify-center items-center">
                  <span class="text-[9px] text-slate-500 font-bold uppercase mb-0.5">Attribués</span>
                  <span>${g.total}</span>
                </div>
                <div class="${isDone ? 'bg-emerald-100 text-emerald-800 border-emerald-200' : 'bg-orange-50 text-orange-700 border-orange-200'} px-3 py-1.5 rounded-2xl text-sm font-black shadow-inner border flex-1 flex flex-col justify-center items-center">
                  <span class="text-[9px] font-bold uppercase mb-0.5 opacity-80">Restants</span>
                  <span>${g.pending}</span>
                </div>
              </div>
            </div>

            <div class="${isOpen ? 'block' : 'hidden'} border-t border-slate-100 bg-slate-50/50 p-3 space-y-2">
        `;

        g.items.forEach(t => {
           const isItemDone = String(t.statut).toUpperCase() === 'VALIDE';
           cardHtml += `
             <div ${isItemDone ? '' : `onclick="selectTourneeTask('${t.id}')"`} class="flex items-center justify-between p-2.5 rounded-xl ${isItemDone ? 'bg-emerald-50 border border-emerald-100 opacity-60' : 'bg-white border border-slate-200 shadow-sm cursor-pointer hover:border-orange-300 active:scale-95 transition'}">
                <div class="min-w-0 pr-2 flex-1">
                   <div class="flex items-center gap-2 mb-0.5 flex-wrap">
                     <span class="font-mono font-black text-[11px] text-orange-600">${t.sapRef}</span>
                     ${isItemDone ? '<i data-lucide="check-circle" class="w-3.5 h-3.5 text-emerald-500"></i>' : ''}
                   </div>
                   <div class="text-[10px] font-medium text-slate-600 break-words whitespace-normal leading-snug">${t.designation}</div>
                </div>
                ${!isItemDone ? '<div class="shrink-0 bg-orange-50 p-1.5 rounded-lg text-orange-600"><i data-lucide="chevron-right" class="w-4 h-4"></i></div>' : ''}
             </div>
           `;
        });

        cardHtml += `</div></div>`;
        return cardHtml;
      };

      if (aTraiter.length > 0) {
        html += `<h3 class="text-xs font-black text-indigo-600 uppercase tracking-wider mb-3 mt-1 flex items-center gap-1.5"><i data-lucide="clipboard-list" class="w-4 h-4"></i> Missions à traiter</h3>`;
        aTraiter.forEach(t => { 
          html += renderCard(t, false); 
        });
      }

      if (terminees.length > 0) {
        html += `<h3 class="text-xs font-black text-emerald-600 uppercase tracking-wider mt-5 mb-3 flex items-center gap-1.5"><i data-lucide="check-circle-2" class="w-4 h-4"></i> Missions terminées</h3>`;
        terminees.forEach(t => { 
          html += renderCard(t, true); 
        });
      }

      if (html === '') {
        if (agentTournees.length > 0) {
          html = `<div class="p-4 bg-slate-800 text-green-400 font-mono text-[10px] rounded-xl overflow-auto"><b>ERREUR FILTRE STATUT</b><br>${JSON.stringify(agentTournees, null, 2)}</div>`;
        } else {
          html = `<div class="p-8 text-center text-slate-400 italic text-xs bg-white border border-slate-200 rounded-2xl shadow-sm">Aucune tâche assignée. Votre file d'attente est vide !</div>`;
        }
      }

      c.innerHTML = html;
      lucide.createIcons();
    }

    function switchMobileTab(t) { 
      const tabs = ['Comptage', 'Historique', 'Tournee'];
      tabs.forEach(x => { 
        const tabEl = document.getElementById("tab" + x);
        if (tabEl) {
          tabEl.classList.add("hidden"); 
        }
        
        const n = document.getElementById("nav" + x); 
        if (n) {
          n.className = "flex flex-col items-center space-y-0.5 text-slate-400 font-bold text-[9px] transition cursor-pointer"; 
        }
      }); 
      
      const a = t.charAt(0).toUpperCase() + t.slice(1); 
      const activeTab = document.getElementById("tab" + a);
      if (activeTab) {
        activeTab.classList.remove("hidden"); 
      }
      
      const aN = document.getElementById("nav" + a); 
      if (aN) {
        aN.className = "flex flex-col items-center space-y-0.5 text-emerald-600 font-bold text-[9px] transition cursor-pointer"; 
      }
      
      if (t === 'historique') {
        renderHistory(); 
      }
      if (t === 'tournee') {
        renderTournee(); 
      }
      lucide.createIcons(); 
    }
  </script>
</body>
</html>
