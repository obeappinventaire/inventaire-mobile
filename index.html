<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Inventaire Chantier PWA</title>
  <link rel="icon" type="image/png" href="app_icon_co2h2o.png">
  <link rel="apple-touch-icon" href="app_icon_co2h2o.png">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">

  <!-- SCRIPTS & CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/tesseract.js@v4.0.2/dist/tesseract.min.js"></script>

  <style>
    body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="h-full text-slate-800 flex flex-col font-sans select-none antialiased bg-slate-50 overflow-hidden">

  <!-- ================= EN-TÊTE MOBILE ================= -->
  <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between shrink-0 shadow-sm z-20">
    <div class="flex items-center space-x-2.5">
      <div class="w-8 h-8 rounded-lg overflow-hidden border border-slate-200 bg-slate-50 flex items-center justify-center shadow-xs">
        <img src="app_icon_co2h2o.png" alt="Logo" class="w-6 h-6 object-contain">
      </div>
      <div>
        <h1 class="text-xs font-bold text-slate-900 tracking-tight">Inventaire Chantier</h1>
        <p class="text-[10px] text-orange-600 font-bold" id="headerAgentName">--</p>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <div id="syncDot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
      <button onclick="openConfigModal()" class="p-2 rounded-xl bg-slate-100 text-slate-700 hover:bg-slate-200 transition">
        <i data-lucide="settings" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- ================= CONTENU PRINCIPAL (ONGS PWA) ================= -->
  <main class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-4 pb-24">
    
    <!-- ONGLET 1 : COMPTAGE -->
    <section id="tabComptage" class="space-y-4">
      <div class="bg-white border border-slate-200 p-4 rounded-2xl shadow-xs space-y-3">
        <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Paramètres de Saisie</h2>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Entrepreneur</label>
            <select id="selectContractor" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-xs font-semibold text-slate-800 focus:outline-none focus:border-orange-500"></select>
          </div>
          <div>
            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Métier</label>
            <select id="selectTrade" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-xs font-semibold text-slate-800 focus:outline-none focus:border-orange-500"></select>
          </div>
        </div>
      </div>

      <div class="bg-white border border-slate-200 p-4 rounded-2xl shadow-xs space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Article SAP</h2>
          <span id="sapStatusBadge" class="text-[10px] font-mono font-bold text-orange-700 bg-orange-50 px-2 py-0.5 rounded border border-orange-200">Recherche active</span>
        </div>

        <div class="flex items-center space-x-2">
          <div class="relative flex-1">
            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
            <input type="text" id="sapSearchInput" oninput="onSapSearchInput(this.value)" placeholder="Réf SAP ou libellé..." class="w-full bg-slate-50 border border-slate-300 rounded-xl py-2.5 pl-9 pr-3 text-xs text-slate-800 font-medium focus:outline-none focus:border-orange-500">
            <div id="sapSuggestions" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-xl shadow-xl z-30 max-h-48 overflow-y-auto custom-scrollbar p-1 space-y-1"></div>
          </div>
          <button onclick="toggleVoiceSearch()" id="micBtn" class="p-2.5 rounded-xl bg-slate-100 text-slate-700 hover:bg-slate-200 transition shrink-0">
            <i data-lucide="mic" class="w-5 h-5"></i>
          </button>
        </div>

        <div id="selectedArticleCard" class="hidden bg-orange-50 border border-orange-200 p-3 rounded-xl space-y-1">
          <div class="flex justify-between items-start">
            <span id="cardSapRef" class="font-mono text-xs font-bold text-orange-800">--</span>
            <span id="cardDesignation" class="text-xs font-semibold text-slate-900 text-right truncate max-w-[200px]">--</span>
          </div>
        </div>
      </div>

      <div class="bg-white border border-slate-200 p-4 rounded-2xl shadow-xs space-y-4">
        <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Quantité Comptée</h2>
        <div class="flex items-center justify-center space-x-4">
          <button onclick="adjustQuantity(-1)" class="w-14 h-14 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 font-black text-xl rounded-2xl flex items-center justify-center transition shadow-xs">-</button>
          <input type="number" id="inputQuantity" value="1" min="0" class="w-24 h-14 text-center font-black text-2xl bg-slate-50 border border-slate-300 rounded-2xl focus:outline-none focus:border-orange-500 font-mono">
          <button onclick="adjustQuantity(1)" class="w-14 h-14 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 font-black text-xl rounded-2xl flex items-center justify-center transition shadow-xs">+</button>
        </div>

        <button onclick="submitInventoryEntry()" class="w-full h-12 bg-orange-600 hover:bg-orange-700 active:bg-orange-800 font-bold text-white rounded-xl shadow-md flex items-center justify-center space-x-2 text-xs transition">
          <i data-lucide="check-circle" class="w-4 h-4"></i>
          <span>Enregistrer la saisie</span>
        </button>
      </div>
    </section>

    <!-- ONGLET 2 : HISTORIQUE -->
    <section id="tabHistorique" class="hidden space-y-3">
      <div class="flex justify-between items-center px-1">
        <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Saisies de la session</h2>
        <span id="historyCount" class="text-xs font-mono font-bold text-orange-700">0 ligne(s)</span>
      </div>
      <div id="historyListContainer" class="space-y-2"></div>
    </section>

    <!-- ONGLET 3 : MA TOURNÉE (SYNCHRONISÉE AVEC L'AGENDA) -->
    <section id="tabTournee" class="hidden space-y-4">
      <div class="bg-white border border-slate-200 p-4 rounded-2xl shadow-xs space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Feuille de route du jour</h2>
          <span id="tourneeDateBadge" class="text-[10px] font-mono font-bold text-orange-700 bg-orange-50 px-2 py-0.5 rounded border border-orange-200">--</span>
        </div>
        <div id="tourneeListContainer" class="space-y-2"></div>
      </div>
    </section>

  </main>

  <!-- ================= BARRE DE NAVIGATION INFÉRIEURE MOBILE ================= -->
  <nav class="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-6 py-2.5 flex justify-around items-center z-20 shadow-lg">
    <button onclick="switchMobileTab('comptage')" id="navComptage" class="flex flex-col items-center space-y-1 text-orange-600 font-bold text-[10px] transition">
      <i data-lucide="calculator" class="w-5 h-5"></i>
      <span>Comptage</span>
    </button>
    <button onclick="switchMobileTab('historique')" id="navHistorique" class="flex flex-col items-center space-y-1 text-slate-400 font-bold text-[10px] transition">
      <i data-lucide="history" class="w-5 h-5"></i>
      <span>Historique</span>
    </button>
    <button onclick="switchMobileTab('tournee')" id="navTournee" class="flex flex-col items-center space-y-1 text-slate-400 font-bold text-[10px] transition">
      <i data-lucide="route" class="w-5 h-5"></i>
      <span>Ma Tournée</span>
    </button>
  </nav>

  <!-- ================= MODALE CONFIGURATION AGENT ================= -->
  <div id="configModal" class="fixed inset-0 bg-slate-900/40 z-50 flex items-center justify-center p-4 backdrop-blur-sm hidden">
    <div class="bg-white border border-slate-200 w-full max-w-sm rounded-2xl p-6 shadow-xl space-y-4 text-center">
      <h2 class="text-lg font-bold text-slate-900">Configuration Agent</h2>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1 text-left">Votre Nom / Profil</label>
        <select id="configAgentSelect" class="w-full bg-slate-50 border border-slate-300 rounded-xl h-11 px-3 text-xs font-semibold text-slate-800 focus:outline-none focus:border-orange-500"></select>
      </div>
      <button onclick="saveAgentConfig()" class="w-full h-11 bg-orange-600 font-bold text-white rounded-xl text-xs shadow-md transition">Valider & Démarrer</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(err => console.warn('SW error:', err));
      });
    }

    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbysSqcdAtUIWYj9YUmxKTt2W9PvcsoLBig2SikCANNQL1Sr3wkn0qbNn9GYQugM1uje/exec";

    let currentAgent = localStorage.getItem("mob_current_agent") || "";
    let catalog = JSON.parse(localStorage.getItem("offline_catalog") || "[]");
    let availableAgents = JSON.parse(localStorage.getItem("offline_agents") || "[]");
    let availableContractors = JSON.parse(localStorage.getItem("offline_contractors") || "[]");
    let availableTrades = JSON.parse(localStorage.getItem("offline_trades") || "[]");
    let cachedTournees = JSON.parse(localStorage.getItem("offline_tournees") || "[]");
    let sessionHistory = JSON.parse(localStorage.getItem("mob_session_history") || "[]");
    let selectedArticle = null;
    let currentGpsCoords = { lat: null, lng: null };

    document.addEventListener("DOMContentLoaded", async () => {
      lucide.createIcons();
      initMobileDropdowns();

      if (!currentAgent) {
        document.getElementById("configModal").classList.remove("hidden");
      } else {
        document.getElementById("headerAgentName").innerText = currentAgent;
      }

      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(pos => {
          currentGpsCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        }, err => console.warn("GPS warning:", err), { enableHighAccuracy: true });
      }

      await syncMobileData();
      renderHistory();
      renderTournee();
    });

    function initMobileDropdowns() {
      const agentSel = document.getElementById("configAgentSelect");
      if (agentSel) {
        agentSel.innerHTML = '<option value="">-- Choisir votre profil --</option>' + availableAgents.map(a => `<option value="${a}">${a}</option>`).join('');
        if (currentAgent) agentSel.value = currentAgent;
      }

      const cSel = document.getElementById("selectContractor");
      const tSel = document.getElementById("selectTrade");
      if (cSel) cSel.innerHTML = availableContractors.map(c => `<option value="${c}">${c}</option>`).join('');
      if (tSel) tSel.innerHTML = availableTrades.map(t => `<option value="${t}">${t}</option>`).join('');
    }

    function openConfigModal() {
      document.getElementById("configModal").classList.remove("hidden");
    }

    function saveAgentConfig() {
      const sel = document.getElementById("configAgentSelect").value;
      if (!sel) {
        alert("Veuillez sélectionner un profil agent.");
        return;
      }
      currentAgent = sel;
      localStorage.setItem("mob_current_agent", currentAgent);
      document.getElementById("headerAgentName").innerText = currentAgent;
      document.getElementById("configModal").classList.add("hidden");
      renderTournee();
    }

    async function syncMobileData() {
      if (!navigator.onLine || GOOGLE_SCRIPT_URL.includes("placeholder")) return;
      try {
        const res = await fetch(`${GOOGLE_SCRIPT_URL}?t=${Date.now()}`);
        const data = await res.json();
        if (data.status === "success") {
          if (data.catalog) {
            catalog = data.catalog;
            localStorage.setItem("offline_catalog", JSON.stringify(catalog));
          }
          if (data.agents) {
            availableAgents = data.agents;
            localStorage.setItem("offline_agents", JSON.stringify(availableAgents));
          }
          if (data.contractors) {
            availableContractors = data.contractors;
            localStorage.setItem("offline_contractors", JSON.stringify(availableContractors));
          }
          if (data.trades) {
            availableTrades = data.trades;
            localStorage.setItem("offline_trades", JSON.stringify(availableTrades));
          }
          if (data.tournees) {
            cachedTournees = data.tournees;
            localStorage.setItem("offline_tournees", JSON.stringify(cachedTournees));
          }
          initMobileDropdowns();
          renderTournee();
        }
      } catch (err) {
        console.warn("Échec sync mobile :", err);
      }
    }

    function onSapSearchInput(val) {
      const q = String(val || "").trim().toLowerCase();
      const dd = document.getElementById("sapSuggestions");
      if (!q) {
        dd.classList.add("hidden");
        return;
      }

      const filtered = catalog.filter(i => String(i.sapRef).toLowerCase().includes(q) || String(i.designation).toLowerCase().includes(q)).slice(0, 15);

      if (filtered.length === 0) {
        dd.innerHTML = `<div class="p-2 text-xs text-slate-400 italic text-center">Aucun article trouvé</div>`;
        dd.classList.remove("hidden");
        return;
      }

      dd.innerHTML = filtered.map(item => `
        <div onclick='selectArticleFromSearch(${JSON.stringify(item)})' class="p-2 hover:bg-orange-50 rounded-lg cursor-pointer text-xs flex justify-between items-center">
          <div>
            <span class="font-mono font-bold text-orange-800">${item.sapRef}</span>
            <span class="text-slate-700 ml-1.5">${item.designation}</span>
          </div>
        </div>
      `).join('');
      dd.classList.remove("hidden");
    }

    function selectArticleFromSearch(item) {
      selectedArticle = item;
      document.getElementById("sapSearchInput").value = item.sapRef;
      document.getElementById("sapSuggestions").classList.add("hidden");
      document.getElementById("cardSapRef").innerText = item.sapRef;
      document.getElementById("cardDesignation").innerText = item.designation;
      document.getElementById("selectedArticleCard").classList.remove("hidden");
    }

    function adjustQuantity(delta) {
      const input = document.getElementById("inputQuantity");
      let val = (parseInt(input.value, 10) || 0) + delta;
      if (val < 0) val = 0;
      input.value = val;
    }

    async function submitInventoryEntry() {
      if (!currentAgent) {
        alert("Veuillez configurer votre nom d'agent (icône engrenage).");
        openConfigModal();
        return;
      }
      if (!selectedArticle) {
        alert("Veuillez sélectionner un article SAP.");
        return;
      }

      const qty = parseInt(document.getElementById("inputQuantity").value, 10) || 0;
      const contractor = document.getElementById("selectContractor").value;
      const trade = document.getElementById("selectTrade").value;

      const record = {
        id: "INV-" + Date.now().toString(36) + Math.random().toString(36).substring(2, 5),
        timestamp: new Date().toISOString(),
        user: currentAgent,
        contractor: contractor,
        trade: trade,
        sapRef: selectedArticle.sapRef,
        designation: selectedArticle.designation,
        quantity: qty,
        lat: currentGpsCoords.lat,
        lng: currentGpsCoords.lng
      };

      sessionHistory.unshift(record);
      localStorage.setItem("mob_session_history", JSON.stringify(sessionHistory));

      // Validation automatique de la tâche dans la tournée locale si elle existe
      cachedTournees.forEach(t => {
        if (t.agent === currentAgent && String(t.sapRef).trim() === String(selectedArticle.sapRef).trim()) {
          t.statut = 'VALIDE';
        }
      });
      localStorage.setItem("offline_tournees", JSON.stringify(cachedTournees));

      renderHistory();
      renderTournee();

      // Reset formulaire
      selectedArticle = null;
      document.getElementById("sapSearchInput").value = "";
      document.getElementById("selectedArticleCard").classList.add("hidden");
      document.getElementById("inputQuantity").value = "1";

      alert("Saisie enregistrée avec succès !");

      if (navigator.onLine && !GOOGLE_SCRIPT_URL.includes("placeholder")) {
        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "CREATE", ...record })
          });
        } catch (e) {
          console.warn("Échec envoi distant immédiat :", e);
        }
      }
    }

    function renderHistory() {
      const container = document.getElementById("historyListContainer");
      const countLbl = document.getElementById("historyCount");
      if (!container) return;

      countLbl.innerText = `${sessionHistory.length} ligne(s)`;
      if (sessionHistory.length === 0) {
        container.innerHTML = `<div class="p-6 text-center text-slate-400 italic text-xs">Aucune saisie pour le moment.</div>`;
        return;
      }

      container.innerHTML = sessionHistory.map(h => `
        <div class="bg-white border border-slate-200 p-3 rounded-2xl shadow-xs space-y-1 text-xs">
          <div class="flex justify-between items-center">
            <span class="font-mono font-bold text-orange-800">${h.sapRef}</span>
            <span class="font-mono font-black text-emerald-700 text-sm">Qté : ${h.quantity}</span>
          </div>
          <p class="font-semibold text-slate-900 truncate">${h.designation}</p>
          <div class="flex justify-between items-center text-[10px] text-slate-400 pt-1 border-t border-slate-100">
            <span>${h.contractor} (${h.trade})</span>
            <span class="font-mono">${new Date(h.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
          </div>
        </div>
      `).join('');
    }

    // RENDU DE "MA TOURNÉE" FILTRÉE STRICTEMENT SUR LA DATE DU JOUR POUR L'AGENT CONNECTÉ
    function renderTournee() {
      const container = document.getElementById("tourneeListContainer");
      const dateBadge = document.getElementById("tourneeDateBadge");
      if (!container) return;

      const todayStr = new Date().toISOString().split('T')[0];
      if (dateBadge) dateBadge.innerText = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });

      const agentTournees = (cachedTournees || []).filter(t => t.agent === currentAgent && t.date === todayStr);

      if (agentTournees.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-slate-400 italic text-xs bg-white border border-slate-200 rounded-2xl">Aucune tournée assignée pour vous aujourd'hui. Bon travail en mode libre !</div>`;
        return;
      }

      container.innerHTML = agentTournees.map(t => {
        const isDone = t.statut === 'VALIDE';
        const trancheLabel = t.tranche === 'APRES_MIDI' ? '🌇 Après-midi' : '☀️ Matin';

        return `
          <div onclick="selectArticleFromTournee('${t.sapRef}')" class="bg-white border ${isDone ? 'border-emerald-200 bg-emerald-50/40' : 'border-slate-200'} p-3.5 rounded-2xl shadow-xs cursor-pointer transition hover:border-orange-300 space-y-1.5">
            <div class="flex justify-between items-center text-xs">
              <span class="font-mono font-bold text-orange-800">${t.sapRef}</span>
              <span class="px-2 py-0.5 rounded text-[10px] font-bold ${isDone ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${isDone ? 'VALIDE' : 'À FAIRE'}</span>
            </div>
            <p class="text-xs font-bold text-slate-900 truncate">${t.designation || 'Sans désignation'}</p>
            <div class="flex justify-between items-center text-[10px] text-slate-500 pt-1 border-t border-slate-100">
              <span>${t.contractor} (${t.trade})</span>
              <span class="font-mono text-orange-700 font-semibold">${trancheLabel}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function selectArticleFromTournee(sapRef) {
      const item = catalog.find(i => String(i.sapRef).trim() === String(sapRef).trim());
      if (item) {
        selectArticleFromSearch(item);
        switchMobileTab('comptage');
      } else {
        alert("Article introuvable dans le catalogue.");
      }
    }

    function switchMobileTab(tab) {
      document.getElementById("tabComptage").classList.add("hidden");
      document.getElementById("tabHistorique").classList.add("hidden");
      document.getElementById("tabTournee").classList.add("hidden");

      document.getElementById("navComptage").className = "flex flex-col items-center space-y-1 text-slate-400 font-bold text-[10px] transition";
      document.getElementById("navHistorique").className = "flex flex-col items-center space-y-1 text-slate-400 font-bold text-[10px] transition";
      document.getElementById("navTournee").className = "flex flex-col items-center space-y-1 text-slate-400 font-bold text-[10px] transition";

      if (tab === 'comptage') {
        document.getElementById("tabComptage").classList.remove("hidden");
        document.getElementById("navComptage").className = "flex flex-col items-center space-y-1 text-orange-600 font-bold text-[10px] transition";
      } else if (tab === 'historique') {
        document.getElementById("tabHistorique").classList.remove("hidden");
        document.getElementById("navHistorique").className = "flex flex-col items-center space-y-1 text-orange-600 font-bold text-[10px] transition";
        renderHistory();
      } else if (tab === 'tournee') {
        document.getElementById("tabTournee").classList.remove("hidden");
        document.getElementById("navTournee").className = "flex flex-col items-center space-y-1 text-orange-600 font-bold text-[10px] transition";
        renderTournee();
      }
      lucide.createIcons();
    }

    function toggleVoiceSearch() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert("La reconnaissance vocale n'est pas supportée par ce navigateur.");
        return;
      }
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = 'fr-FR';
      recognition.interimResults = false;

      const btn = document.getElementById("micBtn");
      btn.className = "p-2.5 rounded-xl bg-rose-600 text-white transition shrink-0 animate-pulse";

      recognition.onresult = function(event) {
        const text = event.results[0][0].transcript;
        document.getElementById("sapSearchInput").value = text;
        onSapSearchInput(text);
        btn.className = "p-2.5 rounded-xl bg-slate-100 text-slate-700 hover:bg-slate-200 transition shrink-0";
      };

      recognition.onerror = function() {
        btn.className = "p-2.5 rounded-xl bg-slate-100 text-slate-700 hover:bg-slate-200 transition shrink-0";
      };

      recognition.onend = function() {
        btn.className = "p-2.5 rounded-xl bg-slate-100 text-slate-700 hover:bg-slate-200 transition shrink-0";
      };

      recognition.start();
    }
  </script>
</body>
</html>
