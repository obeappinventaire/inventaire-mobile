<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Inventaire Logistique Terrain</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
    #reader video { border-radius: 0.75rem; object-fit: cover; width: 100% !important; }
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] { -moz-appearance: textfield; }
  </style>
</head>
<body class="h-full text-slate-100 flex flex-col font-sans select-none antialiased">

  <!-- ================= MODALE SÉLECTION AGENT ================= -->
  <div id="userModal" class="fixed inset-0 bg-slate-950/95 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-5">
      <div class="text-center space-y-1">
        <div class="w-12 h-12 rounded-full bg-blue-600/20 text-blue-400 flex items-center justify-center mx-auto mb-2">
          <i data-lucide="user-check" class="w-6 h-6"></i>
        </div>
        <h2 class="text-xl font-bold text-white">Identification Agent</h2>
        <p class="text-xs text-slate-400">Sélectionnez votre nom pour démarrer l'inventaire</p>
      </div>

      <div class="space-y-2">
        <label class="block text-xs font-bold text-slate-400 uppercase">Agent Magasinier</label>
        <select id="modalAgentSelect" class="w-full bg-slate-800 border-2 border-blue-500/50 rounded-xl p-3.5 text-base text-white font-medium focus:ring-2 focus:ring-blue-400 focus:outline-none">
          <option value="">Chargement de la liste...</option>
        </select>
      </div>

      <button id="btnConfirmAgent" onclick="confirmAgentSelection()" class="w-full h-14 bg-blue-600 active:bg-blue-700 font-bold rounded-xl text-white shadow-lg flex items-center justify-center space-x-2 text-base transition">
        <span>Commencer la session</span>
        <i data-lucide="arrow-right" class="w-5 h-5"></i>
      </button>
    </div>
  </div>

  <!-- ================= EN-TÊTE ================= -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between shadow-md shrink-0">
    <div class="flex items-center space-x-2">
      <div id="statusDot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
      <span id="statusText" class="text-[11px] font-bold uppercase tracking-wider text-emerald-400">En ligne</span>
      
      <!-- Badge de file d'attente hors ligne -->
      <button id="queueBadge" onclick="flushQueue()" class="hidden px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30 text-[10px] font-bold flex items-center space-x-1 active:bg-amber-500/30">
        <i data-lucide="cloud-upload" class="w-3 h-3"></i>
        <span id="queueCount">0 en attente</span>
      </button>
    </div>

    <div class="flex items-center space-x-2 bg-slate-800/80 px-2.5 py-1 rounded-lg border border-slate-700">
      <i data-lucide="user" class="w-3.5 h-3.5 text-blue-400"></i>
      <span id="currentAgentName" class="text-xs font-bold text-slate-200 truncate max-w-[110px]">Chargement...</span>
      <button onclick="openAgentModal()" title="Changer d'agent" class="text-slate-400 hover:text-white pl-1">
        <i data-lucide="refresh-cw" class="w-3 h-3"></i>
      </button>
    </div>
  </header>

  <!-- ================= VUES PRINCIPALES ================= -->
  <main class="flex-1 overflow-y-auto p-4 max-w-md mx-auto w-full pb-24">

    <!-- ========== VUE 1 : SAISIE DE COMPTAGE ========== -->
    <section id="view-inventory" class="space-y-4">
      
      <!-- Contexte Entreprise & Métier -->
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3 shadow">
        <div>
          <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Entrepreneur</label>
          <select id="contractorSelect" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-blue-500"></select>
        </div>
        <div>
          <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Corps d'état / Métier</label>
          <select id="tradeSelect" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-blue-500"></select>
        </div>
      </div>

      <!-- Module Scanner & Recherche -->
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3 shadow">
        
        <button id="btnScan" onclick="toggleScanner()" class="w-full h-14 bg-indigo-600 active:bg-indigo-700 font-bold rounded-xl flex items-center justify-center space-x-2 text-white shadow-lg">
          <i data-lucide="scan-barcode" class="w-6 h-6"></i>
          <span id="btnScanText">SCANNER QR OU CODE-BARRES</span>
        </button>

        <div id="scannerContainer" class="hidden relative overflow-hidden rounded-xl border-2 border-indigo-500 bg-black">
          <div id="reader" class="w-full"></div>
          <p class="text-[11px] text-center text-slate-400 py-1.5">Centrez le code (QR, EAN-13, Code 128)</p>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Recherche (Réf SAP, EAN, QR ou Fournisseur)</label>
          <div class="flex space-x-2">
            <input type="text" id="articleSearchInput" placeholder="Ex: 106060 ou 54123..." 
                   onkeydown="if(event.key==='Enter') searchArticle(this.value)"
                   class="flex-1 bg-slate-950 border border-slate-700 rounded-lg p-3 text-sm text-white font-mono uppercase focus:outline-none focus:border-blue-500">
            <button onclick="searchArticle(document.getElementById('articleSearchInput').value)" class="px-4 bg-slate-800 active:bg-slate-700 rounded-lg font-bold">
              <i data-lucide="search" class="w-5 h-5 text-slate-300"></i>
            </button>
          </div>
        </div>

        <!-- Fiche descriptive de l'article -->
        <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800 space-y-2">
          <div class="flex items-start justify-between">
            <div class="min-w-0 pr-2">
              <span class="text-[10px] font-bold text-indigo-400 uppercase tracking-wide">Fiche Matériel</span>
              <h4 id="dispDesignation" class="text-sm font-bold text-white truncate">Scannez ou recherchez un article</h4>
            </div>
            <div id="badgeIdentified" class="hidden px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 text-[10px] font-bold shrink-0">
              Prêt
            </div>
          </div>
          
          <div class="grid grid-cols-2 gap-2 text-xs pt-1 border-t border-slate-850">
            <div>
              <span class="text-slate-400 block text-[10px]">Réf SAP :</span>
              <span id="dispSap" class="font-mono font-bold text-slate-200">--</span>
            </div>
            <div>
              <span class="text-slate-400 block text-[10px]">Réf Fournisseur :</span>
              <span id="dispSupplier" class="font-mono text-slate-200 truncate block">--</span>
            </div>
            <div>
              <span class="text-slate-400 block text-[10px]">Code EAN :</span>
              <span id="dispEan" class="font-mono text-slate-200">--</span>
            </div>
            <div>
              <span class="text-slate-400 block text-[10px]">QR Code :</span>
              <span id="dispQr" class="font-mono text-slate-200 truncate block">--</span>
            </div>
          </div>
        </div>

      </div>

      <!-- Pavé de Quantité -->
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 shadow">
        <label class="block text-[11px] font-bold text-slate-400 uppercase text-center mb-2">Quantité inventoriée</label>
        <div class="flex items-center justify-center space-x-4">
          <button type="button" onclick="adjustQuantity(-1)" class="w-16 h-16 bg-slate-800 active:bg-slate-700 rounded-xl flex items-center justify-center text-3xl font-bold shadow text-white">-</button>
          
          <input type="number" id="qtyInput" placeholder="0" min="1" inputmode="numeric" 
                 class="w-36 h-16 bg-slate-950 border-2 border-slate-700 rounded-xl text-center text-3xl font-black text-white focus:border-blue-500 focus:outline-none placeholder-slate-600">
          
          <button type="button" onclick="adjustQuantity(1)" class="w-16 h-16 bg-slate-800 active:bg-slate-700 rounded-xl flex items-center justify-center text-3xl font-bold shadow text-white">+</button>
        </div>
      </div>

      <!-- Validation -->
      <button id="btnSubmit" onclick="submitInventory()" class="w-full h-16 bg-emerald-600 active:bg-emerald-700 text-white font-extrabold text-lg rounded-2xl shadow-xl flex items-center justify-center space-x-3 transition">
        <i data-lucide="check-circle" class="w-7 h-7"></i>
        <span>VALIDER ET ARCHIVER</span>
      </button>

    </section>

    <!-- ========== VUE 2 : HISTORIQUE ========== -->
    <section id="view-history" class="hidden space-y-4">
      <div class="relative">
        <i data-lucide="search" class="w-5 h-5 absolute left-3 top-3.5 text-slate-400"></i>
        <input type="text" id="searchHistoryInput" oninput="filterHistory()" placeholder="Filtrer l'historique..." class="w-full bg-slate-900 border border-slate-800 rounded-xl py-3 pl-10 pr-4 text-sm text-white focus:outline-none focus:border-blue-500">
      </div>

      <div class="flex justify-between items-center text-xs text-slate-400 px-1">
        <span>Dernières saisies</span>
        <button onclick="syncData()" class="flex items-center space-x-1 text-indigo-400 active:text-indigo-300">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
          <span>Actualiser</span>
        </button>
      </div>

      <div id="historyList" class="space-y-2"></div>
    </section>

  </main>

  <!-- ================= BARRE DE NAVIGATION ================= -->
  <nav class="fixed bottom-0 inset-x-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 grid grid-cols-2 h-16 max-w-md mx-auto">
    <button id="tabNavInventory" onclick="switchTab('inventory')" class="flex flex-col items-center justify-center text-blue-400">
      <i data-lucide="clipboard-list" class="w-5 h-5"></i>
      <span class="text-xs font-semibold mt-1">Comptage</span>
    </button>
    <button id="tabNavHistory" onclick="switchTab('history')" class="flex flex-col items-center justify-center text-slate-400">
      <i data-lucide="history" class="w-5 h-5"></i>
      <span class="text-xs font-semibold mt-1">Historique</span>
    </button>
  </nav>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed top-4 inset-x-4 max-w-sm mx-auto bg-slate-900 border border-emerald-500 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3 transform -translate-y-28 transition-transform duration-300 pointer-events-none z-50">
    <div id="toastIcon" class="text-emerald-400"><i data-lucide="check" class="w-6 h-6"></i></div>
    <div class="flex-1 text-sm font-medium" id="toastMessage">Action validée</div>
  </div>

  <script>
    // ⚠️ METTEZ BIEN VOTRE URL GOOGLE APPS SCRIPT CI-DESSOUS :
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbysSqcdAtUIWYj9YUmxKTt2W9PvcsoLBig2SikCANNQL1Sr3wkn0qbNn9GYQugM1uje/exec";

    // Lecture du cache local pour un démarrage instantané hors-ligne
    let catalog = JSON.parse(localStorage.getItem("offline_catalog") || "[]");
    let availableAgents = JSON.parse(localStorage.getItem("offline_agents") || "[]");
    let availableContractors = JSON.parse(localStorage.getItem("offline_contractors") || "[]");
    let availableTrades = JSON.parse(localStorage.getItem("offline_trades") || "[]");
    let cachedHistory = JSON.parse(localStorage.getItem("offline_history") || "[]");

    let currentAgent = localStorage.getItem("inv_current_agent") || "";
    let activeItem = null;
    let html5QrCode = null;
    let isScanning = false;
    let isSyncingQueue = false;

    document.addEventListener("DOMContentLoaded", async () => {
      lucide.createIcons();
      initNetworkStatus();
      updateAgentUI();
      populateDropdowns();
      renderHistory(cachedHistory);
      updateQueueBadge();

      // Tentative de synchronisation réseau
      await syncData();

      // Vérification sélection agent
      if (!currentAgent || (availableAgents.length > 0 && !availableAgents.includes(currentAgent))) {
        openAgentModal();
      }

      // Vider la file d'attente s'il y a du réseau au lancement
      if (navigator.onLine) {
        flushQueue();
      }
    });

    // --- GESTION DE LA FILE D'ATTENTE HORS-LIGNE ---
    function getOfflineQueue() {
      return JSON.parse(localStorage.getItem("inv_offline_queue") || "[]");
    }

    function saveOfflineQueue(queue) {
      localStorage.setItem("inv_offline_queue", JSON.stringify(queue));
      updateQueueBadge();
    }

    function updateQueueBadge() {
      const queue = getOfflineQueue();
      const badge = document.getElementById("queueBadge");
      const count = document.getElementById("queueCount");
      if (queue.length > 0) {
        badge.classList.remove("hidden");
        count.innerText = `${queue.length} en attente`;
      } else {
        badge.classList.add("hidden");
      }
    }

    async function flushQueue() {
      if (isSyncingQueue || !navigator.onLine || GOOGLE_SCRIPT_URL.includes("placeholder")) return;

      const queue = getOfflineQueue();
      if (queue.length === 0) return;

      isSyncingQueue = true;
      showToast(`Envoi de ${queue.length} saisie(s) en attente...`);

      const remaining = [...queue];
      while (remaining.length > 0) {
        const item = remaining[0];
        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(item)
          });
          remaining.shift();
          saveOfflineQueue(remaining);
        } catch (err) {
          console.warn("Échec d'envoi d'un élément, arrêt de la synchronisation :", err);
          break;
        }
      }

      isSyncingQueue = false;
      if (remaining.length === 0) {
        showToast("Synchronisation terminée !");
      }
      updateQueueBadge();
    }

    // --- GESTION DE L'AGENT ---
    function openAgentModal() {
      const select = document.getElementById("modalAgentSelect");
      if (availableAgents.length === 0) {
        select.innerHTML = '<option value="">Aucun agent en mémoire</option>';
      } else {
        select.innerHTML = '<option value="">-- Choisir votre nom --</option>' + 
          availableAgents.map(a => `<option value="${a}" ${a === currentAgent ? 'selected' : ''}>${a}</option>`).join('');
      }
      document.getElementById("userModal").classList.remove("hidden");
    }

    function confirmAgentSelection() {
      const select = document.getElementById("modalAgentSelect");
      if (!select.value) {
        alert("Veuillez sélectionner votre nom dans la liste.");
        return;
      }
      currentAgent = select.value;
      localStorage.setItem("inv_current_agent", currentAgent);
      updateAgentUI();
      document.getElementById("userModal").classList.add("hidden");
      showToast(`Session : ${currentAgent}`);
    }

    function updateAgentUI() {
      document.getElementById("currentAgentName").innerText = currentAgent || "Non défini";
    }

    function populateDropdowns() {
      const cSelect = document.getElementById("contractorSelect");
      const tSelect = document.getElementById("tradeSelect");

      if (availableContractors.length > 0) {
        cSelect.innerHTML = availableContractors.map(c => `<option value="${c}">${c}</option>`).join('');
      } else {
        cSelect.innerHTML = '<option value="">Aucun entrepreneur</option>';
      }

      if (availableTrades.length > 0) {
        tSelect.innerHTML = availableTrades.map(t => `<option value="${t}">${t}</option>`).join('');
      } else {
        tSelect.innerHTML = '<option value="">Aucun métier</option>';
      }
    }

    function adjustQuantity(delta) {
      const input = document.getElementById("qtyInput");
      let currentVal = parseInt(input.value, 10);
      if (isNaN(currentVal) || currentVal <= 0) {
        currentVal = delta > 0 ? delta : 1;
      } else {
        currentVal = Math.max(1, currentVal + delta);
      }
      input.value = currentVal;
    }

    function searchArticle(term) {
      const q = String(term).trim().toUpperCase();
      if (!q) return;

      const match = catalog.find(item => 
        String(item.sapRef).toUpperCase() === q ||
        String(item.ean).toUpperCase() === q ||
        String(item.qr).toUpperCase() === q ||
        String(item.supplierRef).toUpperCase() === q
      );

      if (match) {
        activeItem = { ...match };
      } else {
        activeItem = {
          sapRef: q,
          designation: "Article (" + q + ")",
          supplierRef: "Non indexé",
          ean: q.length >= 8 ? q : "N/A",
          qr: "N/A"
        };
      }

      document.getElementById("dispDesignation").innerText = activeItem.designation;
      document.getElementById("dispSap").innerText = activeItem.sapRef;
      document.getElementById("dispSupplier").innerText = activeItem.supplierRef;
      document.getElementById("dispEan").innerText = activeItem.ean;
      document.getElementById("dispQr").innerText = activeItem.qr;
      document.getElementById("articleSearchInput").value = activeItem.sapRef;
      document.getElementById("badgeIdentified").classList.remove("hidden");
    }

    // --- SCANNER UNIVERSEL ---
    async function toggleScanner() {
      const container = document.getElementById("scannerContainer");
      const btnText = document.getElementById("btnScanText");

      if (isScanning) {
        await stopScanner();
        return;
      }

      container.classList.remove("hidden");
      btnText.innerText = "FERMER LA CAMÉRA";
      html5QrCode = new Html5Qrcode("reader");

      const config = {
        fps: 20,
        qrbox: { width: 280, height: 160 },
        formatsToSupport: [
          Html5QrcodeSupportedFormats.QR_CODE,
          Html5QrcodeSupportedFormats.DATA_MATRIX,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E
        ]
      };

      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          config,
          (decodedText) => {
            searchArticle(decodedText);
            showToast("Scanné : " + decodedText);
            stopScanner();
          },
          () => {}
        );
        isScanning = true;
      } catch (err) {
        alert("Erreur caméra. Vérifiez les autorisations.");
        container.classList.add("hidden");
        btnText.innerText = "SCANNER QR OU CODE-BARRES";
      }
    }

    async function stopScanner() {
      if (html5QrCode && isScanning) {
        await html5QrCode.stop();
        html5QrCode.clear();
      }
      isScanning = false;
      document.getElementById("scannerContainer").classList.add("hidden");
      document.getElementById("btnScanText").innerText = "SCANNER QR OU CODE-BARRES";
    }

    // --- ARCHIVAGE ET ENVOI ---
    async function submitInventory() {
      if (!currentAgent) {
        openAgentModal();
        return;
      }
      if (!activeItem) {
        alert("Veuillez scanner ou chercher un article avant d'enregistrer.");
        return;
      }

      const qtyInput = document.getElementById("qtyInput");
      const qty = parseInt(qtyInput.value, 10);
      if (isNaN(qty) || qty <= 0) {
        alert("Veuillez renseigner une quantité valide.");
        qtyInput.focus();
        return;
      }

      const btn = document.getElementById("btnSubmit");
      const contractor = document.getElementById("contractorSelect").value;
      const trade = document.getElementById("tradeSelect").value;

      const now = new Date();
      const dateId = now.toISOString().slice(0, 10).replace(/-/g, "");
      const randSuffix = Math.floor(1000 + Math.random() * 9000);
      const invId = `INV-${dateId}-${randSuffix}`;

      const payload = {
        id: invId,
        timestamp: now.toLocaleString("fr-FR"),
        user: currentAgent,
        contractor: contractor,
        trade: trade,
        sapRef: activeItem.sapRef,
        designation: activeItem.designation,
        supplierRef: activeItem.supplierRef,
        ean: activeItem.ean,
        qr: activeItem.qr,
        quantity: qty
      };

      btn.disabled = true;
      btn.innerHTML = `<span class="inline-block animate-spin mr-2">⏳</span> Enregistrement...`;

      let sentDirectly = false;

      // Tentative d'envoi immédiat si en ligne
      if (navigator.onLine && !GOOGLE_SCRIPT_URL.includes("placeholder")) {
        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
          });
          sentDirectly = true;
        } catch (e) {
          console.warn("Échec réseau direct, bascule en file locale.");
        }
      }

      // Si non envoyé directement, stockage dans la file hors ligne
      if (!sentDirectly) {
        const queue = getOfflineQueue();
        queue.push(payload);
        saveOfflineQueue(queue);
      }

      // Mise à jour de l'historique local visible
      cachedHistory.unshift(payload);
      localStorage.setItem("offline_history", JSON.stringify(cachedHistory.slice(0, 30)));
      renderHistory(cachedHistory);

      showToast(sentDirectly ? `Archivé : ${activeItem.sapRef} (x${qty})` : `Sauvegardé hors-ligne : ${activeItem.sapRef} (x${qty})`);

      // Réinitialisation du formulaire
      qtyInput.value = "";
      document.getElementById("articleSearchInput").value = "";
      activeItem = null;
      document.getElementById("dispDesignation").innerText = "Scannez ou recherchez un article";
      document.getElementById("dispSap").innerText = "--";
      document.getElementById("dispSupplier").innerText = "--";
      document.getElementById("dispEan").innerText = "--";
      document.getElementById("dispQr").innerText = "--";
      document.getElementById("badgeIdentified").classList.add("hidden");

      btn.disabled = false;
      btn.innerHTML = `<i data-lucide="check-circle" class="w-7 h-7"></i><span>VALIDER ET ARCHIVER</span>`;
      lucide.createIcons();
    }

    // --- SYNCHRONISATION INITIALE DU CATALOGUE ---
    async function syncData() {
      if (!navigator.onLine || GOOGLE_SCRIPT_URL.includes("placeholder")) return;

      try {
        const res = await fetch(GOOGLE_SCRIPT_URL);
        const data = await res.json();
        if (data.status === "success") {
          if (data.agents && data.agents.length) {
            availableAgents = data.agents;
            localStorage.setItem("offline_agents", JSON.stringify(availableAgents));
          }
          if (data.contractors && data.contractors.length) {
            availableContractors = data.contractors;
            localStorage.setItem("offline_contractors", JSON.stringify(availableContractors));
          }
          if (data.trades && data.trades.length) {
            availableTrades = data.trades;
            localStorage.setItem("offline_trades", JSON.stringify(availableTrades));
          }
          if (data.catalog && data.catalog.length) {
            catalog = data.catalog;
            localStorage.setItem("offline_catalog", JSON.stringify(catalog));
          }

          populateDropdowns();

          if (data.history && data.history.length) {
            cachedHistory = data.history;
            localStorage.setItem("offline_history", JSON.stringify(cachedHistory.slice(0, 30)));
            renderHistory(cachedHistory);
          }
        }
      } catch (err) {
        console.warn("Impossible d'actualiser depuis Google Sheets, utilisation des données locales.");
      }
    }

    function renderHistory(items) {
      const container = document.getElementById("historyList");
      if (!items || items.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-500 text-sm">Aucun inventaire en mémoire.</div>`;
        return;
      }
      container.innerHTML = items.map(item => `
        <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 flex items-center justify-between space-x-3">
          <div class="min-w-0 flex-1">
            <div class="flex items-center space-x-2">
              <span class="text-xs font-mono font-bold text-indigo-400">${item.sapRef}</span>
              <span class="text-[10px] text-slate-400">• ${item.timestamp}</span>
            </div>
            <p class="text-sm font-semibold text-slate-100 truncate">${item.designation}</p>
            <p class="text-xs text-slate-400 truncate">${item.contractor} (${item.trade})</p>
          </div>
          <div class="text-right shrink-0">
            <span class="text-lg font-black text-emerald-400">x${item.quantity}</span>
            <p class="text-[10px] text-slate-400 truncate"><i data-lucide="user" class="inline w-2.5 h-2.5 mr-0.5"></i>${item.user}</p>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function filterHistory() {
      const q = document.getElementById("searchHistoryInput").value.toLowerCase();
      const filtered = cachedHistory.filter(i => 
        (i.sapRef && i.sapRef.toLowerCase().includes(q)) ||
        (i.designation && i.designation.toLowerCase().includes(q)) ||
        (i.contractor && i.contractor.toLowerCase().includes(q)) ||
        (i.user && i.user.toLowerCase().includes(q))
      );
      renderHistory(filtered);
    }

    function switchTab(tab) {
      const invView = document.getElementById("view-inventory");
      const histView = document.getElementById("view-history");
      const tabInv = document.getElementById("tabNavInventory");
      const tabHist = document.getElementById("tabNavHistory");

      if (tab === 'inventory') {
        invView.classList.remove("hidden");
        histView.classList.add("hidden");
        tabInv.classList.replace("text-slate-400", "text-blue-400");
        tabHist.classList.replace("text-blue-400", "text-slate-400");
      } else {
        if (isScanning) stopScanner();
        invView.classList.add("hidden");
        histView.classList.remove("hidden");
        tabHist.classList.replace("text-slate-400", "text-blue-400");
        tabInv.classList.replace("text-blue-400", "text-slate-400");
        renderHistory(cachedHistory);
        syncData();
      }
      lucide.createIcons();
    }

    function initNetworkStatus() {
      const update = () => {
        const isOnline = navigator.onLine;
        const dot = document.getElementById("statusDot");
        const txt = document.getElementById("statusText");
        dot.className = isOnline ? "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse" : "w-2.5 h-2.5 rounded-full bg-rose-500";
        txt.className = isOnline ? "text-[11px] font-bold uppercase tracking-wider text-emerald-400" : "text-[11px] font-bold uppercase tracking-wider text-rose-400";
        txt.innerText = isOnline ? "En ligne" : "Hors-ligne";

        if (isOnline) {
          flushQueue();
        }
      };
      window.addEventListener("online", update);
      window.addEventListener("offline", update);
      update();
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      document.getElementById("toastMessage").innerText = msg;
      toast.classList.remove("-translate-y-28");
      toast.classList.add("translate-y-0");
      setTimeout(() => {
        toast.classList.remove("translate-y-0");
        toast.classList.add("-translate-y-28");
      }, 2500);
    }
  </script>
</body>
</html>
