<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Inventaire Express Terrain</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
    #reader video { border-radius: 0.75rem; object-fit: cover; width: 100% !important; }
  </style>
</head>
<body class="h-full text-slate-100 flex flex-col font-sans select-none antialiased">

  <!-- MODALE SÉLECTION DE L'AGENT AU DÉMARRAGE -->
  <div id="userModal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-2xl">
      <div class="flex items-center space-x-3">
        <div class="p-2.5 bg-indigo-600/20 text-indigo-400 rounded-xl">
          <i data-lucide="user-check" class="w-6 h-6"></i>
        </div>
        <div>
          <h2 class="text-base font-bold text-white">Opérateur d'inventaire</h2>
          <p class="text-xs text-slate-400">Identifiez-vous avant de commencer</p>
        </div>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-400 uppercase mb-1.5">Magasinier</label>
        <select id="userModalSelect" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500">
          <option value="">-- Sélectionner un profil --</option>
        </select>
      </div>
      <button onclick="confirmUserModal()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl text-sm transition">
        Démarrer l'inventaire
      </button>
    </div>
  </div>

  <!-- EN-TÊTE FIXE -->
  <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex items-center justify-between shadow-md shrink-0">
    <div class="flex items-center space-x-2">
      <div id="statusDot" class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
      <span id="statusText" class="text-xs font-semibold uppercase tracking-wider text-emerald-400">En ligne</span>
    </div>
    <div class="flex items-center space-x-2">
      <span id="adminBadge" class="hidden text-[10px] bg-indigo-600/30 border border-indigo-500/40 text-indigo-300 px-2 py-0.5 rounded font-black font-mono">ADMIN</span>
      <span id="displayUserName" class="text-sm font-semibold text-slate-200 truncate max-w-[120px]">Opérateur</span>
      <button onclick="openUserModal(true)" class="p-1 text-slate-400 hover:text-white">
        <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
      </button>
      <button onclick="syncData()" class="p-1 text-slate-400 hover:text-indigo-400" title="Synchroniser">
        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- CONTENU DÉFILANT -->
  <main class="flex-1 overflow-y-auto p-4 max-w-md mx-auto w-full pb-24">

    <!-- VUE 1 : COMPTAGE -->
    <section id="view-inventory" class="space-y-4">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3 shadow">
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Entrepreneur</label>
          <select id="contractorSelect" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-base text-white focus:ring-2 focus:ring-blue-500">
            <option value="">Chargement...</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Corps d'état / Métier</label>
          <select id="tradeSelect" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-base text-white focus:ring-2 focus:ring-blue-500">
            <option value="">Chargement...</option>
          </select>
        </div>
      </div>

      <!-- SCAN & RECHERCHE -->
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3 shadow">
        <button id="btnScan" onclick="toggleScanner()" class="w-full h-14 bg-indigo-600 active:bg-indigo-700 hover:bg-indigo-500 font-bold rounded-xl flex items-center justify-center space-x-2 text-white shadow-lg transition">
          <i data-lucide="camera" class="w-6 h-6"></i>
          <span class="text-base" id="btnScanText">SCANNER CODE-BARRES / QR</span>
        </button>

        <div id="scannerContainer" class="hidden relative overflow-hidden rounded-xl border-2 border-indigo-500 bg-black">
          <div id="reader" class="w-full"></div>
          <p class="text-xs text-center text-slate-400 py-2">Ciblez le code-barres ou le QR</p>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Réf SAP, EAN, Fournisseur</label>
          <div class="flex space-x-2">
            <input type="text" id="sapInput" placeholder="Ex: 106060 ou code-barres" class="flex-1 bg-slate-900 border border-slate-600 rounded-lg p-3 text-base text-white uppercase focus:ring-2 focus:ring-blue-500">
            <button onclick="handleManualSearch()" class="px-4 bg-slate-700 active:bg-slate-600 rounded-lg font-semibold flex items-center justify-center">
              <i data-lucide="search" class="w-5 h-5"></i>
            </button>
          </div>
        </div>

        <!-- FICHE ARTICLE -->
        <div class="bg-slate-900 p-3 rounded-lg border border-slate-750 flex items-center space-x-3">
          <div class="w-14 h-14 rounded-lg bg-slate-800 border border-slate-750 flex items-center justify-center shrink-0">
            <i data-lucide="package" class="w-7 h-7 text-slate-400"></i>
          </div>
          <div class="flex-1 min-w-0">
            <h4 id="itemDesignation" class="text-sm font-bold text-slate-200 truncate">Scannez ou saisissez un code...</h4>
            <p id="itemSap" class="text-xs text-indigo-400 font-mono mt-0.5">SAP: --</p>
            <p id="itemSupplier" class="text-xs text-slate-400 truncate">Fournisseur: --</p>
          </div>
        </div>
      </div>

      <!-- QUANTITÉ -->
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow">
        <label class="block text-xs font-bold text-slate-400 uppercase text-center mb-2">Quantité constatée (≥ 0)</label>
        <div class="flex items-center justify-between space-x-3">
          <button onclick="adjustQuantity(-1)" class="w-16 h-16 bg-slate-700 active:bg-slate-600 rounded-xl flex items-center justify-center text-3xl font-bold shadow text-white">-</button>
          <input type="number" id="qtyInput" value="" placeholder="0" min="0" class="w-28 h-16 bg-slate-900 border-2 border-slate-600 rounded-xl text-center text-3xl font-black text-white focus:border-indigo-500">
          <button onclick="adjustQuantity(1)" class="w-16 h-16 bg-slate-700 active:bg-slate-600 rounded-xl flex items-center justify-center text-3xl font-bold shadow text-white">+</button>
        </div>
      </div>

      <!-- VALIDATION AVEC GPS -->
      <button id="btnSubmit" onclick="submitInventory()" class="w-full h-16 bg-emerald-600 active:bg-emerald-700 hover:bg-emerald-500 text-white font-extrabold text-lg rounded-2xl shadow-xl flex items-center justify-center space-x-3 transition">
        <i data-lucide="check-circle-2" class="w-7 h-7"></i>
        <span>VALIDER L'INVENTAIRE</span>
      </button>
    </section>

    <!-- VUE 2 : HISTORIQUE -->
    <section id="view-history" class="hidden space-y-4">
      <div class="relative">
        <i data-lucide="search" class="w-5 h-5 absolute left-3 top-3.5 text-slate-400"></i>
        <input type="text" id="searchHistoryInput" oninput="filterHistory()" placeholder="Rechercher dans l'historique..." class="w-full bg-slate-800 border border-slate-700 rounded-xl py-3 pl-10 pr-4 text-sm text-white focus:outline-none">
      </div>
      <div id="historyList" class="space-y-2">
        <div class="text-center py-10 text-slate-500 text-sm">Chargement...</div>
      </div>
    </section>

  </main>

  <!-- NAVIGATION -->
  <nav class="fixed bottom-0 inset-x-0 bg-slate-800/95 backdrop-blur border-t border-slate-700 grid grid-cols-2 h-16 max-w-md mx-auto">
    <button id="tabNavInventory" onclick="switchTab('inventory')" class="flex flex-col items-center justify-center text-blue-400">
      <i data-lucide="clipboard-pen-line" class="w-5 h-5"></i>
      <span class="text-xs font-semibold mt-1">Comptage</span>
    </button>
    <button id="tabNavHistory" onclick="switchTab('history')" class="flex flex-col items-center justify-center text-slate-400">
      <i data-lucide="history" class="w-5 h-5"></i>
      <span class="text-xs font-semibold mt-1">Historique</span>
    </button>
  </nav>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed top-4 inset-x-4 max-w-sm mx-auto bg-slate-900 border border-emerald-500 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3 transform -translate-y-28 transition-transform duration-300 pointer-events-none z-50">
    <div id="toastIcon" class="text-emerald-400"><i data-lucide="check" class="w-5 h-5"></i></div>
    <div class="flex-1 text-xs font-medium" id="toastMessage">Action effectuée</div>
  </div>

  <script>
    // ⚠️ METTEZ ICI VOTRE URL DE DÉPLOIEMENT APPS SCRIPT
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbysSqcdAtUIWYj9YUmxKTt2W9PvcsoLBig2SikCANNQL1Sr3wkn0qbNn9GYQugM1uje/exec";

    let currentAgent = localStorage.getItem("inv_current_user") || "";
    let availableAgents = [];
    let availableContractors = [];
    let availableTrades = [];
    let availableAdmins = [];
    let catalog = [];
    let cachedHistory = JSON.parse(localStorage.getItem("inv_offline_history") || "[]");
    let activeItem = null;
    let html5QrCode = null;
    let isScanning = false;

    window.addEventListener("DOMContentLoaded", async () => {
      lucide.createIcons();
      initNetworkStatus();
      await syncData();

      if (!currentAgent) {
        openUserModal(false);
      } else {
        updateAgentUI();
      }
    });

    function initNetworkStatus() {
      const update = () => {
        const online = navigator.onLine;
        document.getElementById("statusDot").className = `w-3 h-3 rounded-full ${online ? 'bg-emerald-500 animate-pulse' : 'bg-rose-500'}`;
        document.getElementById("statusText").className = `text-xs font-semibold uppercase tracking-wider ${online ? 'text-emerald-400' : 'text-rose-400'}`;
        document.getElementById("statusText").innerText = online ? 'En ligne' : 'Hors-ligne';
      };
      window.addEventListener("online", update);
      window.addEventListener("offline", update);
      update();
    }

    async function syncData() {
      try {
        if (!navigator.onLine || GOOGLE_SCRIPT_URL.includes("placeholder")) return;
        const res = await fetch(GOOGLE_SCRIPT_URL);
        const data = await res.json();
        if (data.status === "success") {
          availableAgents = data.agents || [];
          availableContractors = data.contractors || [];
          availableTrades = data.trades || [];
          availableAdmins = data.admins || [];
          catalog = data.catalog || [];
          cachedHistory = data.history || [];
          localStorage.setItem("inv_offline_history", JSON.stringify(cachedHistory));
          populateSelects();
          renderHistory();
          updateAgentUI();
        }
      } catch (e) {
        console.warn("Échec synchronisation :", e);
      }
    }

    function populateSelects() {
      const cSelect = document.getElementById("contractorSelect");
      const tSelect = document.getElementById("tradeSelect");
      const uSelect = document.getElementById("userModalSelect");

      if (availableContractors.length > 0) {
        cSelect.innerHTML = availableContractors.map(c => `<option value="${c}">${c}</option>`).join("");
      }
      if (availableTrades.length > 0) {
        tSelect.innerHTML = availableTrades.map(t => `<option value="${t}">${t}</option>`).join("");
      }
      if (availableAgents.length > 0) {
        uSelect.innerHTML = '<option value="">-- Sélectionner un profil --</option>' + 
          availableAgents.map(a => `<option value="${a}" ${a === currentAgent ? 'selected' : ''}>${a}</option>`).join("");
      }
    }

    function openUserModal(canCancel) {
      populateSelects();
      document.getElementById("userModal").classList.remove("hidden");
    }

    function confirmUserModal() {
      const selected = document.getElementById("userModalSelect").value;
      if (!selected) {
        alert("Veuillez sélectionner un profil magasinier.");
        return;
      }
      currentAgent = selected;
      localStorage.setItem("inv_current_user", currentAgent);
      document.getElementById("userModal").classList.add("hidden");
      updateAgentUI();
      renderHistory();
    }

    function updateAgentUI() {
      document.getElementById("displayUserName").innerText = currentAgent || "Opérateur";
      const isAdmin = availableAdmins.includes(currentAgent);
      document.getElementById("adminBadge").classList.toggle("hidden", !isAdmin);
    }

    function adjustQuantity(delta) {
      const input = document.getElementById("qtyInput");
      let val = parseInt(input.value, 10);
      if (isNaN(val)) val = 0;
      val = Math.max(0, val + delta);
      input.value = val;
    }

    function selectItemByQuery(query) {
      const q = String(query).trim().toLowerCase();
      if (!q) return;

      const found = catalog.find(item => 
        (item.sapRef && item.sapRef.toLowerCase() === q) ||
        (item.ean && item.ean.toLowerCase() === q) ||
        (item.qr && item.qr.toLowerCase() === q) ||
        (item.supplierRef && item.supplierRef.toLowerCase() === q)
      );

      if (found) {
        activeItem = found;
        document.getElementById("itemDesignation").innerText = found.designation;
        document.getElementById("itemSap").innerText = "SAP: " + found.sapRef;
        document.getElementById("itemSupplier").innerText = "Fournisseur: " + (found.supplierRef || "N/A");
        document.getElementById("sapInput").value = found.sapRef;
        showToast("Article identifié !");
      } else {
        activeItem = {
          sapRef: query.toUpperCase(),
          designation: "Article non indexé (" + query + ")",
          supplierRef: "N/A",
          ean: "",
          qr: ""
        };
        document.getElementById("itemDesignation").innerText = activeItem.designation;
        document.getElementById("itemSap").innerText = "SAP: " + activeItem.sapRef;
        document.getElementById("itemSupplier").innerText = "Fournisseur: N/A";
      }
    }

    function handleManualSearch() {
      const val = document.getElementById("sapInput").value.trim();
      if (val) selectItemByQuery(val);
    }

    async function toggleScanner() {
      const container = document.getElementById("scannerContainer");
      const btnText = document.getElementById("btnScanText");

      if (isScanning) {
        await stopScanner();
        return;
      }

      container.classList.remove("hidden");
      btnText.innerText = "ARRÊTER LA CAMÉRA";
      html5QrCode = new Html5Qrcode("reader");

      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 15, qrbox: { width: 250, height: 180 } },
          (decodedText) => {
            selectItemByQuery(decodedText.trim());
            stopScanner();
          },
          () => {}
        );
        isScanning = true;
      } catch (err) {
        alert("Accès caméra impossible. Vérifiez les autorisations.");
        container.classList.add("hidden");
        btnText.innerText = "SCANNER CODE-BARRES / QR";
      }
    }

    async function stopScanner() {
      if (html5QrCode && isScanning) {
        await html5QrCode.stop();
        html5QrCode.clear();
      }
      isScanning = false;
      document.getElementById("scannerContainer").classList.add("hidden");
      document.getElementById("btnScanText").innerText = "SCANNER CODE-BARRES / QR";
    }

    // GÉOLOCALISATION CAPTURÉE PRÉCISÉMENT AU MOMENT DE LA VALIDATION
    function captureGPS() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) {
          resolve({ lat: null, lng: null });
          return;
        }
        // Timeout de sécurité à 3,5s pour ne pas ralentir le magasinier
        const timer = setTimeout(() => resolve({ lat: null, lng: null }), 3500);

        navigator.geolocation.getCurrentPosition(
          (pos) => {
            clearTimeout(timer);
            resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude });
          },
          () => {
            clearTimeout(timer);
            resolve({ lat: null, lng: null });
          },
          { enableHighAccuracy: true, timeout: 3000, maximumAge: 10000 }
        );
      });
    }

    async function submitInventory() {
      if (!currentAgent) {
        openUserModal(false);
        return;
      }
      if (!activeItem) {
        alert("Veuillez d'abord scanner ou identifier un article.");
        return;
      }

      const qtyInput = document.getElementById("qtyInput").value;
      const qty = parseInt(qtyInput, 10);
      if (isNaN(qty) || qty < 0) {
        alert("Veuillez indiquer une quantité valide (≥ 0).");
        return;
      }

      const btn = document.getElementById("btnSubmit");
      btn.disabled = true;
      btn.innerHTML = `<span>⏳ Acquisition GPS...</span>`;

      // Capture GPS instantanée
      const coords = await captureGPS();

      const record = {
        action: "CREATE",
        id: "INV-" + Date.now().toString(36).toUpperCase(),
        timestamp: new Date().toLocaleString("fr-FR"),
        user: currentAgent,
        contractor: document.getElementById("contractorSelect").value,
        trade: document.getElementById("tradeSelect").value,
        sapRef: activeItem.sapRef,
        designation: activeItem.designation,
        supplierRef: activeItem.supplierRef,
        ean: activeItem.ean,
        qr: activeItem.qr,
        quantity: qty,
        lat: coords.lat,
        lng: coords.lng
      };

      try {
        if (navigator.onLine && !GOOGLE_SCRIPT_URL.includes("placeholder")) {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(record)
          });
          showToast("Inventaire archivé avec position GPS !");
        } else {
          showToast("Archivé hors-ligne (GPS capturé)");
        }
      } catch (err) {
        showToast("Enregistré hors-ligne (attente réseau)");
      }

      cachedHistory.unshift(record);
      localStorage.setItem("inv_offline_history", JSON.stringify(cachedHistory));

      // Réinitialisation de la fiche
      activeItem = null;
      document.getElementById("sapInput").value = "";
      document.getElementById("qtyInput").value = "";
      document.getElementById("itemDesignation").innerText = "Scannez ou saisissez un code...";
      document.getElementById("itemSap").innerText = "SAP: --";
      document.getElementById("itemSupplier").innerText = "Fournisseur: --";

      btn.disabled = false;
      btn.innerHTML = `<i data-lucide="check-circle-2" class="w-7 h-7"></i><span>VALIDER L'INVENTAIRE</span>`;
      lucide.createIcons();
      renderHistory();
    }

    function renderHistory() {
      const container = document.getElementById("historyList");
      const isAdmin = availableAdmins.includes(currentAgent);

      // Un agent standard ne voit que ses saisies ; un admin voit tout
      const displayed = isAdmin 
        ? cachedHistory 
        : cachedHistory.filter(i => i.user === currentAgent);

      if (displayed.length === 0) {
        container.innerHTML = `<div class="text-center py-10 text-slate-500 text-xs">Aucun comptage trouvé.</div>`;
        return;
      }

      container.innerHTML = displayed.map(item => `
        <div class="bg-slate-800 p-3 rounded-xl border border-slate-750 space-y-2">
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-1.5">
              <span class="text-[11px] font-bold px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 font-mono">${item.user}</span>
              <span class="text-[10px] text-slate-400">${item.timestamp}</span>
            </div>
            <span class="text-xl font-black ${Number(item.quantity) === 0 ? 'text-rose-400' : 'text-emerald-400'}">${item.quantity}</span>
          </div>
          <div>
            <p class="text-xs font-bold text-slate-200 truncate">${item.designation}</p>
            <p class="text-[10px] text-slate-400 font-mono">SAP: ${item.sapRef} • ${item.contractor} (${item.trade})</p>
            ${item.lat ? `<p class="text-[9px] text-emerald-400 font-mono mt-0.5">📍 GPS : ${Number(item.lat).toFixed(4)}, ${Number(item.lng).toFixed(4)}</p>` : ''}
          </div>
          <div class="flex justify-end space-x-2 pt-2 border-t border-slate-750">
            <button onclick="editHistoryItem('${item.id}', ${item.quantity})" class="w-11 h-11 bg-slate-700 active:bg-indigo-600 rounded-lg flex items-center justify-center text-slate-200">
              <i data-lucide="pencil" class="w-4 h-4"></i>
            </button>
            <button onclick="deleteHistoryItem('${item.id}', '${item.designation.replace(/'/g, "\\'")}')" class="w-11 h-11 bg-slate-700 active:bg-rose-600 rounded-lg flex items-center justify-center text-rose-400 active:text-white">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      `).join("");
      lucide.createIcons();
    }

    async function editHistoryItem(id, oldQty) {
      const str = prompt("Corriger la quantité constatée (≥ 0) :", oldQty);
      if (str === null) return;
      const newQty = parseInt(str, 10);
      if (isNaN(newQty) || newQty < 0) {
        alert("Quantité invalide.");
        return;
      }

      showToast("Mise à jour...");
      try {
        if (navigator.onLine && !GOOGLE_SCRIPT_URL.includes("placeholder")) {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "UPDATE", id: id, quantity: newQty, user: currentAgent })
          });
        }
      } catch(e){}

      const target = cachedHistory.find(i => i.id === id);
      if (target) target.quantity = newQty;
      localStorage.setItem("inv_offline_history", JSON.stringify(cachedHistory));
      renderHistory();
      showToast("Quantité modifiée !");
    }

    async function deleteHistoryItem(id, designation) {
      if (!confirm(`Supprimer définitivement la saisie :\n"${designation}" ?`)) return;

      showToast("Suppression...");
      try {
        if (navigator.onLine && !GOOGLE_SCRIPT_URL.includes("placeholder")) {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "DELETE", id: id, user: currentAgent })
          });
        }
      } catch(e){}

      cachedHistory = cachedHistory.filter(i => i.id !== id);
      localStorage.setItem("inv_offline_history", JSON.stringify(cachedHistory));
      renderHistory();
      showToast("Ligne supprimée !");
    }

    function filterHistory() {
      const query = document.getElementById("searchHistoryInput").value.toLowerCase();
      const rows = document.querySelectorAll("#historyList > div");
      rows.forEach(r => {
        r.style.display = r.innerText.toLowerCase().includes(query) ? "block" : "none";
      });
    }

    function switchTab(tab) {
      const invView = document.getElementById("view-inventory");
      const histView = document.getElementById("view-history");
      const tabInv = document.getElementById("tabNavInventory");
      const tabHist = document.getElementById("tabNavHistory");

      if (tab === 'inventory') {
        invView.classList.remove("hidden");
        histView.classList.add("hidden");
        tabInv.classList.replace("text-slate-400", "text-blue-400");
        tabHist.classList.replace("text-blue-400", "text-slate-400");
      } else {
        if (isScanning) stopScanner();
        invView.classList.add("hidden");
        histView.classList.remove("hidden");
        tabHist.classList.replace("text-slate-400", "text-blue-400");
        tabInv.classList.replace("text-blue-400", "text-slate-400");
        renderHistory();
      }
      lucide.createIcons();
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      document.getElementById("toastMessage").innerText = msg;
      t.classList.remove("-translate-y-28");
      t.classList.add("translate-y-0");
      setTimeout(() => {
        t.classList.remove("translate-y-0");
        t.classList.add("-translate-y-28");
      }, 2500);
    }
  </script>
</body>
</html>
