<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Inventaire Logistique Mobile</title>

  <!-- Icônes d'application et favicon -->
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#0f172a">

  <!-- Tailwind CSS & Lucide Icons & Scanner -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
    #reader video { border-radius: 0.75rem; object-fit: cover; width: 100% !important; }
  </style>
</head>
<body class="h-full text-slate-100 flex flex-col font-sans select-none antialiased bg-slate-950">

  <!-- ================= MODALE SÉLECTION AGENT ================= -->
  <div id="agentModal" class="fixed inset-0 bg-slate-950/90 z-50 flex items-center justify-center p-4 backdrop-blur-md hidden">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-4 text-center">
      <div class="w-12 h-12 rounded-2xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center mx-auto border border-indigo-500/30">
        <i data-lucide="user-check" class="w-6 h-6"></i>
      </div>
      <div>
        <h3 class="text-base font-bold text-white">Identification Magasinier</h3>
        <p class="text-xs text-slate-400 mt-1">Sélectionnez votre nom pour démarrer les inventaires</p>
      </div>
      <select id="modalAgentSelect" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500">
        <option value="">Chargement de l'équipe...</option>
      </select>
      <button onclick="confirmAgentSelection()" class="w-full h-12 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 font-bold rounded-xl text-white shadow-lg transition">
        Valider et continuer
      </button>
    </div>
  </div>

  <!-- ================= EN-TÊTE FIXE ================= -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between shadow-md shrink-0">
    <div class="flex items-center space-x-2.5">
      <img src="icon.svg" alt="Logo" class="w-6 h-6 rounded-md shadow border border-slate-800">
      <div id="statusDot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
      <span id="statusText" class="text-[11px] font-bold uppercase tracking-wider text-emerald-400">En ligne</span>
    </div>
    <div class="flex items-center space-x-2">
      <span id="adminBadge" class="hidden px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-400 text-[10px] font-bold tracking-wide uppercase border border-indigo-500/30">ADMIN</span>
      <button onclick="openAgentModal()" class="flex items-center space-x-1.5 bg-slate-800/80 px-2.5 py-1 rounded-lg border border-slate-700 text-xs text-slate-200">
        <i data-lucide="user" class="w-3.5 h-3.5 text-slate-400"></i>
        <span id="displayUserName" class="font-medium truncate max-w-[100px]">Magasinier</span>
      </button>
    </div>
  </header>

  <!-- ================= CONTENU PRINCIPAL ================= -->
  <main class="flex-1 overflow-y-auto p-4 max-w-md mx-auto w-full pb-24">

    <!-- ========== VUE 1 : COMPTAGE ========== -->
    <section id="view-inventory" class="space-y-4">

      <!-- Sélections Entrepreneur & Métier -->
      <div class="bg-slate-900 p-3.5 rounded-2xl border border-slate-800 space-y-3 shadow">
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Entrepreneur</label>
          <select id="contractorSelect" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
            <option value="">Sélectionner l'entrepreneur...</option>
          </select>
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Corps d'état / Métier</label>
          <select id="tradeSelect" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
            <option value="">Sélectionner le corps d'état...</option>
          </select>
        </div>
      </div>

      <!-- Module Identification Article & Scan -->
      <div class="bg-slate-900 p-3.5 rounded-2xl border border-slate-800 space-y-3 shadow">
        
        <!-- Bouton Caméra -->
        <button id="btnScan" onclick="toggleScanner()" class="w-full h-12 bg-indigo-600 active:bg-indigo-700 hover:bg-indigo-500 font-bold rounded-xl flex items-center justify-center space-x-2 text-white shadow-lg transition">
          <i data-lucide="scan-barcode" class="w-5 h-5"></i>
          <span id="btnScanText" class="text-sm tracking-wide">SCANNER CODE-BARRES / QR</span>
        </button>

        <!-- Fenêtre Caméra -->
        <div id="scannerContainer" class="hidden relative overflow-hidden rounded-xl border-2 border-indigo-500 bg-black">
          <div id="reader" class="w-full"></div>
          <p class="text-[11px] text-center text-slate-400 py-1.5">Visez le QR Code ou le Code-barres</p>
        </div>

        <!-- Recherche prédictive multi-champs -->
        <div class="relative">
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Recherche (Réf SAP, Désignation, Fournisseur)</label>
          <div class="relative">
            <i data-lucide="search" class="w-5 h-5 absolute left-3.5 top-3.5 text-slate-400"></i>
            <input type="text" id="searchInput" oninput="handleSearchInput(this.value)" onfocus="this.select()" placeholder="Tapez une référence ou un mot-clé..." class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 pl-11 pr-4 text-sm text-white focus:outline-none focus:border-indigo-500 font-medium">
          </div>
          <!-- Dropdown des suggestions -->
          <div id="searchSuggestions" class="hidden absolute left-0 right-0 top-full mt-1 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl max-h-56 overflow-y-auto z-30 divide-y divide-slate-800"></div>
        </div>

        <!-- Fiche descriptive de l'article actif -->
        <div class="bg-slate-950 p-3 rounded-xl border border-slate-850 flex items-center justify-between">
          <div class="min-w-0 pr-2">
            <h4 id="itemDesignation" class="text-xs font-bold text-slate-200 truncate">En attente de sélection...</h4>
            <div class="flex items-center gap-3 mt-1">
              <span id="itemSap" class="text-xs font-mono font-extrabold text-amber-400">SAP: --</span>
              <span id="itemSupplier" class="text-xs text-slate-400 truncate">Fourn: --</span>
            </div>
          </div>
          <div id="itemReadyBadge" class="hidden shrink-0 px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 text-[10px] font-bold tracking-wider uppercase border border-emerald-500/30">
            PRÊT
          </div>
        </div>
      </div>

      <!-- Saisie de Quantité -->
      <div class="bg-slate-900 p-3.5 rounded-2xl border border-slate-800 shadow text-center">
        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-2">Quantité constatée</label>
        <div class="flex items-center justify-center space-x-3">
          <button onclick="adjustQty(-1)" class="w-14 h-14 bg-slate-800 active:bg-slate-700 rounded-xl flex items-center justify-center text-2xl font-bold text-white shadow">-</button>
          <input type="number" id="inputQuantity" min="0" placeholder="0" class="w-36 h-14 bg-slate-950 border-2 border-slate-700 rounded-xl text-center text-2xl font-black text-white focus:border-indigo-500 focus:outline-none font-mono">
          <button onclick="adjustQty(1)" class="w-14 h-14 bg-slate-800 active:bg-slate-700 rounded-xl flex items-center justify-center text-2xl font-bold text-white shadow">+</button>
        </div>
      </div>

      <!-- Bouton Validation Principal -->
      <button id="btnSubmit" onclick="submitInventory()" class="w-full h-14 bg-emerald-600 active:bg-emerald-700 hover:bg-emerald-500 text-white font-black text-base rounded-2xl shadow-xl flex items-center justify-center space-x-2 transition">
        <i data-lucide="check-circle" class="w-6 h-6"></i>
        <span>VALIDER L'INVENTAIRE</span>
      </button>

    </section>

    <!-- ========== VUE 2 : HISTORIQUE ========== -->
    <section id="view-history" class="hidden space-y-4">
      <div class="relative">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
        <input type="text" id="searchHistoryInput" oninput="filterHistory()" placeholder="Filtrer l'historique..." class="w-full bg-slate-900 border border-slate-800 rounded-xl py-2.5 pl-9 pr-4 text-xs text-white focus:outline-none focus:border-indigo-500">
      </div>

      <div class="flex justify-between items-center text-xs text-slate-400 px-1">
        <span id="historyHeaderLabel">Mes saisies</span>
        <button onclick="syncData()" class="flex items-center space-x-1 text-indigo-400 active:text-indigo-300">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
          <span>Actualiser</span>
        </button>
      </div>

      <div id="historyList" class="space-y-2"></div>
    </section>

    <!-- MENTION LÉGALE DISCRÈTE -->
    <div class="text-center pt-6 pb-2">
      <span class="text-[10px] font-medium text-slate-600 tracking-wider uppercase">designed by CO2H2O srlu</span>
    </div>

  </main>

  <!-- ================= BARRE DE NAVIGATION INFÉRIEURE ================= -->
  <nav id="bottomNav" class="fixed bottom-0 inset-x-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 grid grid-cols-2 h-16 max-w-md mx-auto z-40">
    
    <!-- Bouton Comptage avec l'icône SVG personnalisée -->
    <button id="tabNavInventory" onclick="switchTab('inventory')" class="flex flex-col items-center justify-center text-blue-400">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="w-6 h-6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <defs>
          <path id="line-corner-start-higher" d="M 72 83 H 82" />
        </defs>
        <!-- Coins affinés de moitié -->
        <g stroke="currentColor" stroke-width="4">
          <path d="M 12 28 V 20 A 8 8 0 0 1 20 12 H 28"/>
          <path d="M 72 12 H 80 A 8 8 0 0 1 88 20 V 28"/>
          <path d="M 88 72 V 80 A 8 8 0 0 1 80 88 H 72"/>
          <path d="M 28 88 H 20 A 8 8 0 0 1 12 80 V 72"/>
        </g>
        <!-- Barres de scan orange centrées -->
        <g stroke="#f97316" stroke-width="8">
          <line x1="33" y1="28" x2="33" y2="72"/>
          <line x1="50" y1="28" x2="50" y2="72"/>
          <line x1="67" y1="28" x2="67" y2="72"/>
        </g>
        <!-- Mention CO2H2O srlu en orange vif -->
        <text fill="#f97316" font-size="1.4" font-weight="400" font-family="sans-serif" letter-spacing="0.05">
          <textPath href="#line-corner-start-higher" startOffset="0" text-anchor="start">
            CO2H2O srlu
          </textPath>
        </text>
      </svg>
      <span class="text-xs font-semibold mt-1">Comptage</span>
    </button>

    <!-- Bouton Historique -->
    <button id="tabNavHistory" onclick="switchTab('history')" class="flex flex-col items-center justify-center text-slate-400">
      <i data-lucide="history" class="w-5 h-5"></i>
      <span class="text-xs font-semibold mt-1">Historique</span>
    </button>
  </nav>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed top-4 inset-x-4 max-w-sm mx-auto bg-slate-900 border border-emerald-500 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3 transform -translate-y-28 transition-transform duration-300 pointer-events-none z-50">
    <div id="toastIcon" class="text-emerald-400"><i data-lucide="check" class="w-5 h-5"></i></div>
    <div class="flex-1 text-xs font-medium" id="toastMessage">Action effectuée</div>
  </div>

  <script>
    // ⚠️ METTEZ VOTRE URL GOOGLE APPS SCRIPT CI-DESSOUS (/exec)
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbysSqcdAtUIWYj9YUmxKTt2W9PvcsoLBig2SikCANNQL1Sr3wkn0qbNn9GYQugM1uje/exec";

    let availableAgents = [];
    let availableContractors = [];
    let availableTrades = [];
    let adminAgents = [];
    let catalog = [];
    let cachedHistory = JSON.parse(localStorage.getItem("offline_history") || "[]");

    let currentAgent = localStorage.getItem("inv_agent") || "";
    let activeItem = null;
    let html5QrCode = null;
    let isScanning = false;

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      initNetworkStatus();
      updateUserHeader();
      syncData();
    });

    function initNetworkStatus() {
      const updateStatus = () => {
        const isOnline = navigator.onLine;
        const dot = document.getElementById("statusDot");
        const text = document.getElementById("statusText");
        dot.className = isOnline ? "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse" : "w-2.5 h-2.5 rounded-full bg-rose-500";
        text.className = isOnline ? "text-[11px] font-bold uppercase tracking-wider text-emerald-400" : "text-[11px] font-bold uppercase tracking-wider text-rose-400";
        text.innerText = isOnline ? "En ligne" : "Hors-ligne";
      };
      window.addEventListener("online", updateStatus);
      window.addEventListener("offline", updateStatus);
      updateStatus();
    }

    function updateUserHeader() {
      document.getElementById("displayUserName").innerText = currentAgent || "Magasinier";
      const isAdmin = adminAgents.includes(currentAgent);
      document.getElementById("adminBadge").classList.toggle("hidden", !isAdmin);
      document.getElementById("historyHeaderLabel").innerText = isAdmin ? "Toutes les saisies (Admin)" : "Mes saisies";
    }

    function openAgentModal() {
      const select = document.getElementById("modalAgentSelect");
      if (availableAgents.length > 0) {
        select.innerHTML = '<option value="">Choisir son nom...</option>' + availableAgents.map(a => `<option value="${a}" ${a === currentAgent ? 'selected' : ''}>${a}</option>`).join('');
      }
      document.getElementById("agentModal").classList.remove("hidden");
    }

    function confirmAgentSelection() {
      const val = document.getElementById("modalAgentSelect").value;
      if (!val) {
        alert("Veuillez sélectionner votre nom d'agent.");
        return;
      }
      currentAgent = val;
      localStorage.setItem("inv_agent", currentAgent);
      document.getElementById("agentModal").classList.add("hidden");
      updateUserHeader();
      renderHistory();
      showToast("Connecté en tant que " + currentAgent);
    }

    async function syncData() {
      if (GOOGLE_SCRIPT_URL.includes("placeholder")) return;
      try {
        const res = await fetch(GOOGLE_SCRIPT_URL);
        const data = await res.json();
        if (data.status === "success") {
          availableAgents = data.agents || [];
          availableContractors = data.contractors || [];
          availableTrades = data.trades || [];
          adminAgents = data.admins || [];
          catalog = data.catalog || [];
          if (data.history) {
            cachedHistory = data.history;
            localStorage.setItem("offline_history", JSON.stringify(cachedHistory));
          }

          populateDropdowns();
          if (!currentAgent) openAgentModal();
          updateUserHeader();
          renderHistory();
        }
      } catch (err) {
        console.warn("Mode hors-ligne / erreur réseau :", err);
        if (!currentAgent) openAgentModal();
        renderHistory();
      }
    }

    function populateDropdowns() {
      document.getElementById("contractorSelect").innerHTML = '<option value="">Sélectionner un entrepreneur...</option>' + availableContractors.map(c => `<option value="${c}">${c}</option>`).join('');
      document.getElementById("tradeSelect").innerHTML = '<option value="">Sélectionner un corps d\'état...</option>' + availableTrades.map(t => `<option value="${t}">${t}</option>`).join('');
    }

    // --- RECHERCHE ET SELECTION ARTICLE ---
    function handleSearchInput(q) {
      activeItem = null;
      document.getElementById("itemReadyBadge").classList.add("hidden");
      document.getElementById("itemDesignation").innerText = "En attente de sélection...";
      document.getElementById("itemSap").innerText = "SAP: --";
      document.getElementById("itemSupplier").innerText = "Fourn: --";

      const query = q.trim().toLowerCase();
      const drop = document.getElementById("searchSuggestions");
      if (query.length < 2) {
        drop.classList.add("hidden");
        return;
      }

      const words = query.split(/\s+/);
      const matches = catalog.filter(it => {
        const fullTxt = `${it.sapRef} ${it.designation} ${it.supplierRef} ${it.ean} ${it.qr}`.toLowerCase();
        return words.every(w => fullTxt.includes(w));
      }).sort((a, b) => a.designation.localeCompare(b.designation));

      if (matches.length === 0) {
        drop.innerHTML = '<div class="p-3 text-xs text-slate-400 text-center">Aucun article correspondant</div>';
        drop.classList.remove("hidden");
        return;
      }

      drop.innerHTML = matches.map((item, idx) => `
        <div onclick="selectArticleByIndex(${catalog.indexOf(item)})" class="p-3 hover:bg-slate-800 active:bg-slate-700 cursor-pointer transition">
          <p class="text-xs font-semibold text-white truncate">${item.designation}</p>
          <div class="flex justify-between items-center mt-1">
            <span class="text-[11px] font-mono font-extrabold text-amber-400">${item.sapRef}</span>
            <span class="text-[10px] text-slate-400 truncate">${item.supplierRef}</span>
          </div>
        </div>
      `).join('');
      drop.classList.remove("hidden");
    }

    function selectArticleByIndex(idx) {
      const it = catalog[idx];
      if (!it) return;
      activeItem = it;
      document.getElementById("itemDesignation").innerText = it.designation;
      document.getElementById("itemSap").innerText = it.sapRef;
      document.getElementById("itemSupplier").innerText = it.supplierRef || "N/A";
      document.getElementById("searchInput").value = it.designation;
      document.getElementById("searchSuggestions").classList.add("hidden");
      document.getElementById("itemReadyBadge").classList.remove("hidden");
      showToast("Article sélectionné");
    }

    // --- SCANNER CAMÉRA ---
    async function toggleScanner() {
      const box = document.getElementById("scannerContainer");
      const btnTxt = document.getElementById("btnScanText");
      if (isScanning) {
        await stopScanner();
        return;
      }

      box.classList.remove("hidden");
      btnTxt.innerText = "FERMER LE SCAN";
      html5QrCode = new Html5Qrcode("reader");

      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 20, qrbox: { width: 260, height: 160 } },
          (decoded) => {
            const found = catalog.find(c => c.ean === decoded || c.qr === decoded || c.sapRef === decoded);
            if (found) {
              selectArticleByIndex(catalog.indexOf(found));
              showToast("Scanné : " + found.designation);
            } else {
              document.getElementById("searchInput").value = decoded;
              handleSearchInput(decoded);
              showToast("Code scanné : " + decoded);
            }
            stopScanner();
          },
          () => {}
        );
        isScanning = true;
      } catch (e) {
        alert("Accès caméra refusé.");
        box.classList.add("hidden");
        btnTxt.innerText = "SCANNER CODE-BARRES / QR";
      }
    }

    async function stopScanner() {
      if (html5QrCode && isScanning) {
        await html5QrCode.stop();
        html5QrCode.clear();
      }
      isScanning = false;
      document.getElementById("scannerContainer").classList.add("hidden");
      document.getElementById("btnScanText").innerText = "SCANNER CODE-BARRES / QR";
    }

    function adjustQty(delta) {
      const el = document.getElementById("inputQuantity");
      let v = parseInt(el.value, 10);
      if (isNaN(v)) v = 0;
      v = Math.max(0, v + delta);
      el.value = v;
    }

    // --- VALIDATION D'INVENTAIRE ---
    async function submitInventory() {
      if (!currentAgent) {
        openAgentModal();
        return;
      }
      const contractor = document.getElementById("contractorSelect").value;
      const trade = document.getElementById("tradeSelect").value;
      const qtyStr = document.getElementById("inputQuantity").value;
      const qty = parseInt(qtyStr, 10);

      if (!contractor || !trade) {
        alert("Veuillez sélectionner un entrepreneur et un corps d'état.");
        return;
      }
      if (!activeItem) {
        alert("Veuillez identifier un article via la recherche ou le scan.");
        return;
      }
      if (isNaN(qty) || qty < 0) {
        alert("Veuillez renseigner une quantité valide (>= 0).");
        return;
      }

      const payload = {
        action: "CREATE",
        id: "INV-" + Date.now().toString(36).toUpperCase(),
        timestamp: new Date().toLocaleString("fr-FR"),
        user: currentAgent,
        contractor: contractor,
        trade: trade,
        sapRef: activeItem.sapRef,
        designation: activeItem.designation,
        supplierRef: activeItem.supplierRef,
        ean: activeItem.ean || "",
        qr: activeItem.qr || "",
        quantity: qty
      };

      const btn = document.getElementById("btnSubmit");
      btn.disabled = true;

      try {
        if (!GOOGLE_SCRIPT_URL.includes("placeholder")) {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
          });
        }
        cachedHistory.unshift(payload);
        localStorage.setItem("offline_history", JSON.stringify(cachedHistory));
        showToast("Inventaire validé !");

        // Réinitialisation
        document.getElementById("inputQuantity").value = "";
        document.getElementById("searchInput").value = "";
        activeItem = null;
        document.getElementById("itemReadyBadge").classList.add("hidden");
        document.getElementById("itemDesignation").innerText = "En attente de sélection...";
        document.getElementById("itemSap").innerText = "SAP: --";
        document.getElementById("itemSupplier").innerText = "Fourn: --";

      } catch (err) {
        cachedHistory.unshift(payload);
        localStorage.setItem("offline_history", JSON.stringify(cachedHistory));
        showToast("Enregistré hors-ligne !");
      } finally {
        btn.disabled = false;
        renderHistory();
      }
    }

    // --- VUE HISTORIQUE ---
    function renderHistory() {
      const container = document.getElementById("historyList");
      const isAdmin = adminAgents.includes(currentAgent);
      const filtered = cachedHistory.filter(it => isAdmin || it.user === currentAgent);

      if (!filtered || filtered.length === 0) {
        container.innerHTML = '<div class="text-center py-10 text-slate-500 text-xs">Aucune saisie enregistrée.</div>';
        return;
      }

      container.innerHTML = filtered.map(it => `
        <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl flex items-center justify-between shadow-sm">
          <div class="min-w-0 flex-1 pr-2">
            <div class="flex items-center gap-2">
              <span class="text-xs font-mono font-bold text-amber-400">${it.sapRef}</span>
              <span class="text-[10px] text-slate-400">• ${it.timestamp}</span>
            </div>
            <p class="text-xs font-semibold text-white truncate mt-0.5">${it.designation}</p>
            <p class="text-[11px] text-slate-400 truncate">${it.contractor} — <span class="text-slate-500">${it.trade}</span></p>
            ${isAdmin ? `<p class="text-[10px] text-indigo-400 font-bold mt-0.5">Agent: ${it.user}</p>` : ''}
          </div>
          <div class="flex items-center space-x-2 shrink-0">
            <span class="text-base font-black text-white px-2 py-1 bg-slate-950 rounded-lg border border-slate-800 font-mono">${it.quantity}</span>
            <button onclick="editHistoryItem('${it.id}', ${it.quantity})" class="w-10 h-10 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 rounded-lg text-indigo-400 flex items-center justify-center">
              <i data-lucide="pencil" class="w-4 h-4"></i>
            </button>
            <button onclick="deleteHistoryItem('${it.id}', '${it.designation.replace(/'/g, "\\'")}')" class="w-10 h-10 bg-slate-800 hover:bg-slate-700 active:bg-rose-950 rounded-lg text-rose-400 flex items-center justify-center">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    async function editHistoryItem(id, oldQty) {
      const valStr = prompt("Modifier la quantité :", oldQty);
      if (valStr === null) return;
      const nQty = parseInt(valStr, 10);
      if (isNaN(nQty) || nQty < 0) {
        alert("Quantité invalide (>= 0).");
        return;
      }
      showToast("Mise à jour en cours...");
      try {
        if (!GOOGLE_SCRIPT_URL.includes("placeholder")) {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "UPDATE", id: id, quantity: nQty, user: currentAgent })
          });
        }
        const item = cachedHistory.find(i => i.id === id);
        if (item) item.quantity = nQty;
        localStorage.setItem("offline_history", JSON.stringify(cachedHistory));
        renderHistory();
        showToast("Quantité modifiée !");
      } catch (e) {
        alert("Erreur de modification.");
      }
    }

    async function deleteHistoryItem(id, desig) {
      if (!confirm(`Supprimer définitivement :\n"${desig}" ?`)) return;
      showToast("Suppression en cours...");
      try {
        if (!GOOGLE_SCRIPT_URL.includes("placeholder")) {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "DELETE", id: id, user: currentAgent })
          });
        }
        cachedHistory = cachedHistory.filter(i => i.id !== id);
        localStorage.setItem("offline_history", JSON.stringify(cachedHistory));
        renderHistory();
        showToast("Saisie supprimée !");
      } catch (e) {
        alert("Erreur de suppression.");
      }
    }

    function filterHistory() {
      const q = document.getElementById("searchHistoryInput").value.toLowerCase();
      const cards = document.querySelectorAll("#historyList > div");
      cards.forEach(card => {
        card.style.display = card.innerText.toLowerCase().includes(q) ? "flex" : "none";
      });
    }

    function switchTab(tab) {
      const invView = document.getElementById("view-inventory");
      const histView = document.getElementById("view-history");
      const tabInv = document.getElementById("tabNavInventory");
      const tabHist = document.getElementById("tabNavHistory");

      if (tab === 'inventory') {
        invView.classList.remove("hidden");
        histView.classList.add("hidden");
        tabInv.classList.replace("text-slate-400", "text-blue-400");
        tabHist.classList.replace("text-blue-400", "text-slate-400");
      } else {
        if (isScanning) stopScanner();
        invView.classList.add("hidden");
        histView.classList.remove("hidden");
        tabHist.classList.replace("text-slate-400", "text-blue-400");
        tabInv.classList.replace("text-blue-400", "text-slate-400");
        renderHistory();
      }
      lucide.createIcons();
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      document.getElementById("toastMessage").innerText = msg;
      toast.classList.remove("-translate-y-28");
      toast.classList.add("translate-y-0");
      setTimeout(() => {
        toast.classList.remove("translate-y-0");
        toast.classList.add("-translate-y-28");
      }, 2300);
    }
  </script>
</body>
</html>
