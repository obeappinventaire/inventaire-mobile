<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Inventaire Logistique Mobile</title>

  <!-- ICÔNE SMARTPHONE (Ajouter à l'écran d'accueil) -->
  <link rel="icon" type="image/png" href="app_icon_co2h2o.png">
  <link rel="apple-touch-icon" href="app_icon_co2h2o.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
    #reader video { border-radius: 0.75rem; object-fit: cover; width: 100% !important; }
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
  </style>
</head>
<body class="h-full text-slate-100 flex flex-col font-sans select-none antialiased bg-slate-950">

  <!-- MODALE SÉLECTION AGENT -->
  <div id="userModal" class="fixed inset-0 bg-slate-950/95 z-50 flex items-center justify-center p-4 backdrop-blur-sm hidden">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-5 text-center">
      <div class="w-12 h-12 rounded-full bg-blue-600/20 text-blue-400 flex items-center justify-center mx-auto">
        <i data-lucide="user-check" class="w-6 h-6"></i>
      </div>
      <div>
        <h2 class="text-lg font-bold text-white">Identification Agent</h2>
        <p class="text-xs text-slate-400 mt-1">Sélectionnez votre profil pour débuter</p>
      </div>

      <div class="text-left space-y-1">
        <label class="block text-[11px] font-bold text-slate-400 uppercase">Magasinier</label>
        <select id="modalAgentSelect" class="w-full bg-slate-950 border-2 border-slate-700 rounded-xl p-3 text-sm text-white font-medium focus:border-blue-500 focus:outline-none"></select>
      </div>

      <button id="btnConfirmAgent" onclick="confirmAgentSelection()" class="w-full h-12 bg-blue-600 active:bg-blue-700 font-bold rounded-xl text-white shadow-lg flex items-center justify-center space-x-2 text-sm transition">
        <span>Valider mon profil</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <!-- EN-TÊTE -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between shadow-md shrink-0">
    <div class="flex items-center space-x-2">
      <img src="app_icon_co2h2o.png" alt="Logo" class="w-6 h-6 rounded-md shadow border border-slate-800" onerror="this.style.display='none'">
      <div id="statusDot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
      <span id="statusText" class="text-[11px] font-bold uppercase tracking-wider text-emerald-400">En ligne</span>
    </div>

    <div class="flex items-center space-x-2">
      <span id="adminBadge" class="hidden px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 text-[9px] font-black tracking-wider border border-amber-500/30">ADMIN</span>
      <button onclick="openAgentModal()" class="flex items-center space-x-1.5 bg-slate-800/90 px-3 py-1.5 rounded-lg border border-slate-700 text-xs text-slate-200">
        <i data-lucide="user" class="w-3.5 h-3.5 text-blue-400"></i>
        <span id="currentAgentName" class="font-bold truncate max-w-[110px]">Non défini</span>
        <i data-lucide="chevron-down" class="w-3 h-3 text-slate-400 ml-0.5"></i>
      </button>
    </div>
  </header>

  <!-- CONTENU PRINCIPAL -->
  <main class="flex-1 overflow-y-auto p-4 max-w-md mx-auto w-full pb-24">

    <!-- ================= ONGLET 1 : COMPTAGE ================= -->
    <section id="view-inventory" class="space-y-4">
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3 shadow">
        <div>
          <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Entrepreneur</label>
          <select id="contractorSelect" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-blue-500"></select>
        </div>
        <div>
          <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Corps d'état / Métier</label>
          <select id="tradeSelect" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-blue-500"></select>
        </div>
      </div>

      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-4 shadow">
        <button id="btnScan" onclick="toggleScanner()" class="w-full h-14 bg-indigo-600 active:bg-indigo-700 font-bold rounded-xl flex items-center justify-center space-x-2 text-white shadow-lg">
          <i data-lucide="scan-barcode" class="w-6 h-6"></i>
          <span id="btnScanText">SCANNER CODE-BARRES / QR</span>
        </button>

        <div id="scannerContainer" class="hidden relative overflow-hidden rounded-xl border-2 border-indigo-500 bg-black">
          <div id="reader" class="w-full"></div>
          <p class="text-[11px] text-center text-slate-400 py-1.5">Centrez le code</p>
        </div>

        <div class="relative">
          <label class="block text-xs font-bold text-slate-300 uppercase mb-1.5">Recherche Catalogue</label>
          <div class="relative flex items-center">
            <i data-lucide="search" class="w-5 h-5 absolute left-3.5 text-slate-400 pointer-events-none"></i>
            <input type="text" id="articleSearchInput" oninput="onSearchInput(this.value)" onfocus="this.select()" placeholder="Tapez une référence ou désignation..." class="w-full bg-slate-950 border-2 border-slate-700 rounded-xl py-3 pl-11 pr-4 text-sm text-white font-medium focus:outline-none focus:border-indigo-500">
          </div>
          <div id="suggestionsDropdown" class="hidden absolute left-0 right-0 top-full mt-2 bg-slate-900 border-2 border-slate-700 rounded-xl shadow-2xl max-h-64 overflow-y-auto z-30 divide-y divide-slate-800"></div>
        </div>

        <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800">
          <div class="flex items-start justify-between">
            <div class="min-w-0 pr-2">
              <span class="text-[10px] font-bold text-indigo-400 uppercase tracking-wide">Fiche Matériel</span>
              <h4 id="dispDesignation" class="text-sm font-bold text-white truncate">Scannez ou choisissez un article</h4>
            </div>
            <div id="badgeIdentified" class="hidden px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 text-xs font-bold shrink-0">Prêt</div>
          </div>
          <div class="grid grid-cols-2 gap-2 text-xs pt-2 mt-2 border-t border-slate-800">
            <div>
              <span class="text-slate-400 block text-[10px]">Réf Fournisseur :</span>
              <span id="dispSupplier" class="font-mono font-semibold text-blue-400 truncate block">--</span>
            </div>
            <div>
              <span class="text-slate-400 block text-[10px]">Réf SAP :</span>
              <span id="dispSap" class="font-mono font-black text-amber-500">--</span>
            </div>
          </div>
        </div>
      </div>

      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 shadow">
        <label class="block text-[11px] font-bold text-slate-400 uppercase text-center mb-2">Quantité inventoriée (>= 0)</label>
        <div class="flex items-center justify-center space-x-4">
          <button type="button" onclick="adjustQuantity(-1)" class="w-16 h-16 bg-slate-800 active:bg-slate-700 rounded-xl flex items-center justify-center text-3xl font-bold shadow text-white">-</button>
          <input type="number" id="qtyInput" placeholder="0" min="0" class="w-36 h-16 bg-slate-950 border-2 border-slate-700 rounded-xl text-center text-3xl font-black text-white focus:border-blue-500 focus:outline-none font-mono">
          <button type="button" onclick="adjustQuantity(1)" class="w-16 h-16 bg-slate-800 active:bg-slate-700 rounded-xl flex items-center justify-center text-3xl font-bold shadow text-white">+</button>
        </div>
      </div>

      <button id="btnSubmit" onclick="submitInventory()" class="w-full h-16 bg-emerald-600 active:bg-emerald-700 text-white font-extrabold text-base rounded-2xl shadow-xl flex items-center justify-center space-x-2 transition">
        <i data-lucide="check-circle" class="w-6 h-6"></i>
        <span>VALIDER ET ARCHIVER</span>
      </button>
    </section>

    <!-- ================= ONGLET 2 : HISTORIQUE ================= -->
    <section id="view-history" class="hidden space-y-4">
      <div class="flex justify-between items-center text-xs text-slate-400 px-1">
        <span id="historyHeaderLabel">Mes saisies</span>
        <button onclick="syncData()" class="flex items-center space-x-1 text-indigo-400">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
          <span>Actualiser</span>
        </button>
      </div>
      <div id="historyList" class="space-y-2"></div>
    </section>

    <!-- ================= ONGLET 3 : MONITORING MOBILE (ADMIN) ================= -->
    <section id="view-monitoring" class="hidden space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-bold text-white uppercase tracking-wider flex items-center gap-1.5">
          <i data-lucide="activity" class="w-4 h-4 text-indigo-400"></i>
          Supervision Entrepôt
        </h3>
        <button onclick="syncData()" class="text-xs bg-slate-800 px-2.5 py-1 rounded text-indigo-400 border border-slate-700">Actualiser</button>
      </div>

      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl shadow">
          <span class="text-[10px] text-slate-400 block font-bold uppercase">Lignes</span>
          <span id="mobKpiRows" class="text-xl font-black text-white">0</span>
        </div>
        <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl shadow">
          <span class="text-[10px] text-slate-400 block font-bold uppercase">Pièces</span>
          <span id="mobKpiQty" class="text-xl font-black text-emerald-400">0</span>
        </div>
        <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl shadow">
          <span class="text-[10px] text-amber-400 block font-bold uppercase">Alertes</span>
          <span id="mobKpiAlerts" class="text-xl font-black text-amber-400">0</span>
        </div>
      </div>

      <div id="mobMonitoringList" class="space-y-2"></div>
    </section>

    <!-- MENTION DE PIED DE PAGE -->
    <div class="text-center pt-8 pb-3">
      <span class="text-[10px] font-medium text-slate-500 tracking-wider">
        &copy; made by CO2H2O srlu
      </span>
    </div>
  </main>

  <!-- ================= NAVIGATION INFÉRIEURE DYNAMIQUE ================= -->
  <nav id="bottomNav" class="fixed bottom-0 inset-x-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 grid grid-cols-2 h-16 max-w-md mx-auto transition-all">
    <button id="tabNavInventory" onclick="switchTab('inventory')" class="flex flex-col items-center justify-center text-blue-400">
      <i data-lucide="clipboard-list" class="w-5 h-5"></i>
      <span class="text-xs font-semibold mt-1">Comptage</span>
    </button>
    <button id="tabNavHistory" onclick="switchTab('history')" class="flex flex-col items-center justify-center text-slate-400">
      <i data-lucide="history" class="w-5 h-5"></i>
      <span class="text-xs font-semibold mt-1">Historique</span>
    </button>
    <!-- Bouton Monitoring affiché dynamiquement si profil Admin -->
    <button id="tabNavMonitoring" onclick="switchTab('monitoring')" class="hidden flex-col items-center justify-center text-slate-400">
      <i data-lucide="activity" class="w-5 h-5"></i>
      <span class="text-xs font-semibold mt-1">Monitoring</span>
    </button>
  </nav>

  <!-- TOAST -->
  <div id="toast" class="fixed top-4 inset-x-4 max-w-sm mx-auto bg-slate-900 border border-emerald-500 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3 transform -translate-y-28 transition-transform duration-300 pointer-events-none z-50">
    <div id="toastIcon" class="text-emerald-400"><i data-lucide="check" class="w-5 h-5"></i></div>
    <div class="flex-1 text-sm font-medium" id="toastMessage">Action validée</div>
  </div>

  <script>
    // ⚠️ METTEZ VOTRE URL GOOGLE APPS SCRIPT CI-DESSOUS (/exec)
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby3j1H6_6_placeholder/exec";

    const DEFAULT_AGENTS = ["Dawson", "Fabrice", "Fred", "Sylvie", "Marc", "Thomas"];
    const DEFAULT_CONTRACTORS = ["BatiPlus SAS", "Axiome Rénov", "Entreprise Durand"];
    const DEFAULT_TRADES = ["Électricité générale", "Plomberie / Chauffage", "Télécom & Réseaux"];
    const DEFAULT_ADMINS = ["Dawson", "Sylvie"];

    let catalog = JSON.parse(localStorage.getItem("offline_catalog") || "[]");
    let availableAgents = JSON.parse(localStorage.getItem("offline_agents") || "[]");
    let availableContractors = JSON.parse(localStorage.getItem("offline_contractors") || "[]");
    let availableTrades = JSON.parse(localStorage.getItem("offline_trades") || "[]");
    let adminAgents = JSON.parse(localStorage.getItem("offline_admins") || "[]");
    let adminPasswords = JSON.parse(localStorage.getItem("offline_admin_pwds") || "{}");
    let cachedHistory = JSON.parse(localStorage.getItem("offline_history") || "[]");

    let currentAgent = localStorage.getItem("inv_current_agent") || "";
    let isMonitoringUnlocked = false;
    let activeItem = null;
    let html5QrCode = null;
    let isScanning = false;

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();

      if (availableAgents.length === 0) availableAgents = [...DEFAULT_AGENTS];
      if (availableContractors.length === 0) availableContractors = [...DEFAULT_CONTRACTORS];
      if (availableTrades.length === 0) availableTrades = [...DEFAULT_TRADES];
      if (adminAgents.length === 0) adminAgents = [...DEFAULT_ADMINS];

      populateDropdowns();
      updateAgentDisplay();

      if (!currentAgent) {
        openAgentModal();
      }

      syncData();
    });

    function isAdmin() {
      return adminAgents.includes(currentAgent);
    }

    function updateAgentDisplay() {
      document.getElementById("currentAgentName").innerText = currentAgent || "Non défini";
      const adminBadge = document.getElementById("adminBadge");
      const monNavBtn = document.getElementById("tabNavMonitoring");
      const navContainer = document.getElementById("bottomNav");

      if (isAdmin()) {
        adminBadge.classList.remove("hidden");
        monNavBtn.classList.remove("hidden");
        monNavBtn.classList.add("flex");
        navContainer.className = "fixed bottom-0 inset-x-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 grid grid-cols-3 h-16 max-w-md mx-auto";
      } else {
        adminBadge.classList.add("hidden");
        monNavBtn.classList.add("hidden");
        monNavBtn.classList.remove("flex");
        navContainer.className = "fixed bottom-0 inset-x-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 grid grid-cols-2 h-16 max-w-md mx-auto";
      }
    }

    function openAgentModal() {
      const select = document.getElementById("modalAgentSelect");
      const list = availableAgents.length > 0 ? availableAgents : DEFAULT_AGENTS;
      select.innerHTML = '<option value="">-- Choisir votre nom --</option>' + 
        list.map(a => `<option value="${a}" ${a === currentAgent ? 'selected' : ''}>${a}</option>`).join('');
      document.getElementById("userModal").classList.remove("hidden");
    }

    function confirmAgentSelection() {
      const val = document.getElementById("modalAgentSelect").value;
      if (!val) {
        alert("Veuillez sélectionner un nom.");
        return;
      }
      currentAgent = val;
      localStorage.setItem("inv_current_agent", currentAgent);
      isMonitoringUnlocked = false;
      updateAgentDisplay();
      document.getElementById("userModal").classList.add("hidden");
      renderHistory();
      showToast(`Connecté : ${currentAgent}`);
    }

    function populateDropdowns() {
      const c = document.getElementById("contractorSelect");
      const t = document.getElementById("tradeSelect");
      const cList = availableContractors.length > 0 ? availableContractors : DEFAULT_CONTRACTORS;
      const tList = availableTrades.length > 0 ? availableTrades : DEFAULT_TRADES;
      
      c.innerHTML = '<option value="">Sélectionner...</option>' + cList.map(x => `<option value="${x}">${x}</option>`).join('');
      t.innerHTML = '<option value="">Sélectionner...</option>' + tList.map(x => `<option value="${x}">${x}</option>`).join('');
    }

    async function syncData() {
      if (!navigator.onLine || GOOGLE_SCRIPT_URL.includes("placeholder")) return;

      try {
        const res = await fetch(GOOGLE_SCRIPT_URL);
        const data = await res.json();
        if (data.status === "success") {
          if (data.agents && data.agents.length) {
            availableAgents = data.agents;
            localStorage.setItem("offline_agents", JSON.stringify(availableAgents));
          }
          if (data.contractors && data.contractors.length) {
            availableContractors = data.contractors;
            localStorage.setItem("offline_contractors", JSON.stringify(availableContractors));
          }
          if (data.trades && data.trades.length) {
            availableTrades = data.trades;
            localStorage.setItem("offline_trades", JSON.stringify(availableTrades));
          }
          if (data.admins && data.admins.length) {
            adminAgents = data.admins;
            localStorage.setItem("offline_admins", JSON.stringify(adminAgents));
          }
          if (data.adminPasswords) {
            adminPasswords = data.adminPasswords;
            localStorage.setItem("offline_admin_pwds", JSON.stringify(adminPasswords));
          }
          if (data.catalog && data.catalog.length) {
            catalog = data.catalog;
            localStorage.setItem("offline_catalog", JSON.stringify(catalog));
          }
          if (data.history) {
            cachedHistory = data.history;
            localStorage.setItem("offline_history", JSON.stringify(cachedHistory));
          }

          populateDropdowns();
          updateAgentDisplay();
          renderHistory();
          if (isAdmin()) renderMobileMonitoring();
        }
      } catch (e) {
        console.warn("Mode hors ligne actif :", e);
      }
    }

    function adjustQuantity(delta) {
      const el = document.getElementById("qtyInput");
      let val = parseInt(el.value, 10);
      if (isNaN(val)) val = delta > 0 ? delta : 0;
      else val = Math.max(0, val + delta);
      el.value = val;
    }

    function onSearchInput(rawVal) {
      const val = rawVal.trim().toLowerCase();
      const dd = document.getElementById("suggestionsDropdown");

      activeItem = null;
      document.getElementById("dispDesignation").innerText = "Scannez ou choisissez un article";
      document.getElementById("dispSupplier").innerText = "--";
      document.getElementById("dispSap").innerText = "--";
      document.getElementById("badgeIdentified").classList.add("hidden");

      if (val.length < 1) {
        dd.classList.add("hidden");
        return;
      }

      const words = val.split(/\s+/);
      const matches = catalog.filter(it => {
        const fullTxt = `${it.designation || ''} ${it.supplierRef || ''} ${it.sapRef || ''} ${it.ean || ''} ${it.qr || ''}`.toLowerCase();
        return words.every(w => fullTxt.includes(w));
      }).sort((a, b) => (a.designation || '').localeCompare(b.designation || ''));

      if (matches.length === 0) {
        dd.innerHTML = '<div class="p-3 text-xs text-slate-400 text-center">Aucun article trouvé</div>';
        dd.classList.remove("hidden");
        return;
      }

      dd.innerHTML = matches.map(it => `
        <div onclick="selectArticleBySap('${it.sapRef}')" class="p-3 hover:bg-slate-800 cursor-pointer">
          <p class="text-xs font-bold text-white truncate">${it.designation}</p>
          <div class="flex justify-between items-center mt-1">
            <span class="text-xs font-mono font-extrabold text-amber-500">${it.sapRef}</span>
            <span class="text-[10px] text-blue-400">${it.supplierRef || ''}</span>
          </div>
        </div>
      `).join('');
      dd.classList.remove("hidden");
    }

    function selectArticleBySap(sap) {
      const it = catalog.find(i => String(i.sapRef) === String(sap));
      if (!it) return;
      activeItem = { ...it };
      document.getElementById("dispDesignation").innerText = it.designation;
      document.getElementById("dispSupplier").innerText = it.supplierRef || "--";
      document.getElementById("dispSap").innerText = it.sapRef;
      document.getElementById("articleSearchInput").value = it.designation;
      document.getElementById("badgeIdentified").classList.remove("hidden");
      document.getElementById("suggestionsDropdown").classList.add("hidden");
    }

    async function toggleScanner() {
      const box = document.getElementById("scannerContainer");
      const btn = document.getElementById("btnScanText");
      if (isScanning) {
        await stopScanner();
        return;
      }
      box.classList.remove("hidden");
      btn.innerText = "FERMER LE SCAN";
      html5QrCode = new Html5Qrcode("reader");

      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 20, qrbox: { width: 260, height: 160 } },
          (decoded) => {
            const found = catalog.find(i => i.ean === decoded || i.qr === decoded || i.sapRef === decoded);
            if (found) {
              selectArticleBySap(found.sapRef);
              showToast("Trouvé : " + found.designation);
            } else {
              activeItem = { sapRef: decoded, designation: "Article " + decoded, supplierRef: "N/A" };
              document.getElementById("dispDesignation").innerText = activeItem.designation;
              document.getElementById("dispSap").innerText = activeItem.sapRef;
              document.getElementById("badgeIdentified").classList.remove("hidden");
              showToast("Scanné : " + decoded);
            }
            stopScanner();
          },
          () => {}
        );
        isScanning = true;
      } catch (e) {
        alert("Accès caméra refusé.");
        box.classList.add("hidden");
        btn.innerText = "SCANNER CODE-BARRES / QR";
      }
    }

    async function stopScanner() {
      if (html5QrCode && isScanning) {
        await html5QrCode.stop();
        html5QrCode.clear();
      }
      isScanning = false;
      document.getElementById("scannerContainer").classList.add("hidden");
      document.getElementById("btnScanText").innerText = "SCANNER CODE-BARRES / QR";
    }

    async function submitInventory() {
      if (!currentAgent) {
        openAgentModal();
        return;
      }
      if (!activeItem) {
        alert("Veuillez sélectionner ou scanner un article.");
        return;
      }
      const contractor = document.getElementById("contractorSelect").value;
      const trade = document.getElementById("tradeSelect").value;
      const qty = parseInt(document.getElementById("qtyInput").value, 10);

      if (!contractor || !trade) {
        alert("Veuillez choisir un entrepreneur et un corps d'état.");
        return;
      }
      if (isNaN(qty) || qty < 0) {
        alert("Indiquez une quantité valide (>= 0).");
        return;
      }

      const payload = {
        action: "CREATE",
        id: "INV-" + Date.now().toString(36).toUpperCase(),
        timestamp: new Date().toLocaleString("fr-FR"),
        user: currentAgent,
        contractor: contractor,
        trade: trade,
        sapRef: activeItem.sapRef,
        designation: activeItem.designation,
        supplierRef: activeItem.supplierRef || "",
        quantity: qty
      };

      const btn = document.getElementById("btnSubmit");
      btn.disabled = true;

      try {
        if (!GOOGLE_SCRIPT_URL.includes("placeholder")) {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
          });
        }
        cachedHistory.unshift(payload);
        localStorage.setItem("offline_history", JSON.stringify(cachedHistory));
        showToast("Inventaire archivé !");

        document.getElementById("qtyInput").value = "";
        document.getElementById("articleSearchInput").value = "";
        activeItem = null;
        document.getElementById("dispDesignation").innerText = "Scannez ou choisissez un article";
        document.getElementById("dispSap").innerText = "--";
        document.getElementById("dispSupplier").innerText = "--";
        document.getElementById("badgeIdentified").classList.add("hidden");
      } catch (err) {
        cachedHistory.unshift(payload);
        localStorage.setItem("offline_history", JSON.stringify(cachedHistory));
        showToast("Enregistré localement.");
      } finally {
        btn.disabled = false;
        renderHistory();
        if (isAdmin()) renderMobileMonitoring();
      }
    }

    function renderHistory() {
      const c = document.getElementById("historyList");
      const list = cachedHistory.filter(i => i.user === currentAgent);
      document.getElementById("historyHeaderLabel").innerText = `Mes saisies (${list.length})`;

      if (list.length === 0) {
        c.innerHTML = '<div class="text-center py-10 text-slate-500 text-xs">Aucune saisie enregistrée.</div>';
        return;
      }

      c.innerHTML = list.map(it => `
        <div class="bg-slate-900 border border-slate-800 p-3.5 rounded-xl flex items-center justify-between shadow-sm">
          <div class="min-w-0 pr-2">
            <span class="text-xs font-mono font-extrabold text-amber-500">${it.sapRef}</span>
            <span class="text-[10px] text-slate-400">• ${it.timestamp}</span>
            <p class="text-xs font-bold text-white truncate mt-0.5">${it.designation}</p>
            <p class="text-[11px] text-slate-400 truncate">${it.contractor} (${it.trade})</p>
          </div>
          <span class="text-xl font-black text-emerald-400 font-mono px-2 py-1 bg-slate-950 rounded-lg border border-slate-800">${it.quantity}</span>
        </div>
      `).join('');
    }

    function renderMobileMonitoring() {
      if (!isAdmin()) return;
      document.getElementById("mobKpiRows").innerText = cachedHistory.length;
      document.getElementById("mobKpiQty").innerText = cachedHistory.reduce((acc, c) => acc + (Number(c.quantity) || 0), 0);
      document.getElementById("mobKpiAlerts").innerText = cachedHistory.filter(i => Number(i.quantity) === 0 || Number(i.quantity) > 50).length;

      const container = document.getElementById("mobMonitoringList");
      container.innerHTML = cachedHistory.slice(0, 15).map(item => {
        const q = Number(item.quantity);
        const isAlert = (q === 0 || q > 50);
        return `
          <div class="bg-slate-900 p-3 rounded-xl border ${isAlert ? 'border-amber-500/40' : 'border-slate-800'} text-xs space-y-1">
            <div class="flex justify-between items-center">
              <span class="font-bold text-indigo-300">${item.user} • ${item.timestamp}</span>
              <span class="font-black ${q === 0 ? 'text-rose-400' : 'text-emerald-400'} text-sm">${q}</span>
            </div>
            <div class="truncate text-slate-200">${item.designation}</div>
            <div class="text-[10px] text-slate-400 font-mono">${item.contractor} (${item.trade})</div>
          </div>
        `;
      }).join('');
    }

    function switchTab(tab) {
      const inv = document.getElementById("view-inventory");
      const hist = document.getElementById("view-history");
      const mon = document.getElementById("view-monitoring");
      const tInv = document.getElementById("tabNavInventory");
      const tHist = document.getElementById("tabNavHistory");
      const tMon = document.getElementById("tabNavMonitoring");

      if (tab === 'monitoring') {
        if (!isAdmin()) {
          alert("Accès réservé aux administrateurs.");
          return;
        }
        if (!isMonitoringUnlocked) {
          const expected = adminPasswords[currentAgent] || "1234";
          const entered = prompt(`Supervision (${currentAgent})\nEntrez votre mot de passe / code PIN :`);
          if (entered === null) return;
          if (entered !== expected) {
            alert("Mot de passe incorrect.");
            return;
          }
          isMonitoringUnlocked = true;
        }
      }

      inv.classList.add("hidden");
      hist.classList.add("hidden");
      mon.classList.add("hidden");

      tInv.classList.replace("text-blue-400", "text-slate-400");
      tHist.classList.replace("text-blue-400", "text-slate-400");
      if (tMon) tMon.classList.replace("text-blue-400", "text-slate-400");

      if (tab === 'inventory') {
        inv.classList.remove("hidden");
        tInv.classList.replace("text-slate-400", "text-blue-400");
      } else if (tab === 'history') {
        if (isScanning) stopScanner();
        hist.classList.remove("hidden");
        tHist.classList.replace("text-slate-400", "text-blue-400");
        renderHistory();
      } else if (tab === 'monitoring') {
        if (isScanning) stopScanner();
        mon.classList.remove("hidden");
        if (tMon) tMon.classList.replace("text-slate-400", "text-blue-400");
        renderMobileMonitoring();
      }

      syncData();
      lucide.createIcons();
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      document.getElementById("toastMessage").innerText = msg;
      t.classList.remove("-translate-y-28");
      t.classList.add("translate-y-0");
      setTimeout(() => {
        t.classList.remove("translate-y-0");
        t.classList.add("-translate-y-28");
      }, 2200);
    }
  </script>
</body>
</html>
