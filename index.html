<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Inventaire Chantier PWA</title>
  <link rel="icon" type="image/png" href="app_icon_co2h2o.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/tesseract.js@v4.0.2/dist/tesseract.min.js"></script>
  <style>body { overscroll-behavior-y: none; }</style>
</head>
<body class="h-full text-slate-800 flex flex-col font-sans select-none antialiased bg-slate-100 overflow-hidden">

  <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between shrink-0 z-20 shadow-xs">
    <div class="flex items-center space-x-2.5">
      <div class="w-8 h-8 rounded-lg overflow-hidden border bg-slate-50 flex items-center justify-center">
        <img src="app_icon_co2h2o.png" alt="Logo" class="w-6 h-6 object-contain">
      </div>
      <div>
        <h1 class="text-xs font-bold text-slate-900">Inventaire Chantier</h1>
        <p class="text-[10px] text-orange-600 font-bold" id="headerAgentName">--</p>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <div id="syncDot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
      <button onclick="syncMobileData()" class="p-2 rounded-xl bg-slate-100 text-slate-700 relative cursor-pointer"><i data-lucide="refresh-cw" class="w-4 h-4"></i><span id="pendingBadge" class="hidden absolute -top-1 -right-1 bg-rose-600 text-white font-bold text-[9px] w-4 h-4 rounded-full flex items-center justify-center">0</span></button>
      <button onclick="openConfigModal()" class="p-2 rounded-xl bg-slate-100 text-slate-700 cursor-pointer"><i data-lucide="settings" class="w-4 h-4"></i></button>
    </div>
  </header>

  <main class="flex-1 overflow-y-auto p-4 space-y-4 pb-24">
    
    <section id="tabComptage" class="space-y-4">
      <div class="bg-white border p-4 rounded-2xl shadow-xs space-y-3">
        <h2 class="text-xs font-bold text-slate-500 uppercase">Paramètres de Saisie</h2>
        <div class="grid grid-cols-2 gap-2">
          <div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Entrepreneur</label><select id="selectContractor" class="w-full bg-slate-50 border rounded-xl p-2.5 text-xs font-semibold"></select></div>
          <div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Métier</label><select id="selectTrade" class="w-full bg-slate-50 border rounded-xl p-2.5 text-xs font-semibold"></select></div>
        </div>
      </div>

      <div class="bg-white border p-4 rounded-2xl shadow-xs space-y-3">
        <h2 class="text-xs font-bold text-slate-500 uppercase">Recherche active</h2>
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
          <input type="text" id="sapSearchInput" oninput="onSapSearchInput(this.value)" placeholder="Réf SAP ou libellé..." class="w-full bg-slate-50 border rounded-xl py-2.5 pl-9 pr-3 text-xs">
          <div id="sapSuggestions" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border rounded-xl shadow-2xl z-30 max-h-60 overflow-y-auto p-1 space-y-1"></div>
        </div>
        <div id="selectedArticleCard" class="hidden bg-orange-50 border border-orange-200 p-3 rounded-2xl space-y-1 text-xs">
          <span id="cardSapRef" class="font-mono font-bold text-orange-800">--</span>
          <p id="cardDesignation" class="font-semibold text-slate-900 truncate">--</p>
        </div>
      </div>

      <div class="bg-white border p-4 rounded-2xl shadow-xs space-y-4 text-center">
        <h2 class="text-xs font-bold text-slate-500 uppercase text-left">Quantité Comptée</h2>
        <input type="number" id="inputQuantity" value="0" min="0" class="w-36 h-14 text-center font-black text-2xl bg-slate-50 border rounded-2xl font-mono mx-auto">
        <button onclick="submitInventoryEntry()" class="w-full h-12 bg-orange-600 hover:bg-orange-700 font-bold text-white rounded-xl text-xs cursor-pointer shadow-md">Enregistrer la saisie</button>
      </div>
    </section>

    <section id="tabHistorique" class="hidden space-y-3">
      <div class="flex justify-between items-center px-1"><h2 class="text-xs font-bold text-slate-500 uppercase">Saisies de la session</h2><span id="historyCount" class="text-xs font-mono font-bold text-orange-700">0</span></div>
      <div id="historyListContainer" class="space-y-2"></div>
    </section>

    <section id="tabTournee" class="hidden space-y-4">
      <div class="bg-white border p-4 rounded-2xl shadow-xs space-y-3">
        <h2 class="text-xs font-bold text-slate-500 uppercase">Feuille de route</h2>
        <div id="tourneeListContainer" class="space-y-2"></div>
      </div>
    </section>
  </main>

  <nav class="absolute bottom-0 left-0 right-0 bg-white border-t px-6 py-2.5 flex justify-around items-center z-20 shadow-lg">
    <button onclick="switchMobileTab('comptage')" id="navComptage" class="flex flex-col items-center space-y-1 text-orange-600 font-bold text-[10px] cursor-pointer"><i data-lucide="calculator" class="w-5 h-5"></i><span>Comptage</span></button>
    <button onclick="switchMobileTab('historique')" id="navHistorique" class="flex flex-col items-center space-y-1 text-slate-400 font-bold text-[10px] cursor-pointer"><i data-lucide="history" class="w-5 h-5"></i><span>Historique</span></button>
    <button onclick="switchMobileTab('tournee')" id="navTournee" class="flex flex-col items-center space-y-1 text-slate-400 font-bold text-[10px] cursor-pointer"><i data-lucide="route" class="w-5 h-5"></i><span>Ma Tournée</span></button>
  </nav>

  <div id="configModal" class="fixed inset-0 bg-slate-900/40 z-50 flex items-center justify-center p-4 backdrop-blur-sm hidden">
    <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-xl space-y-4 text-center">
      <h2 class="text-base font-bold">Profil Collaborateur</h2>
      <select id="configAgentSelect" class="w-full bg-slate-50 border rounded-xl h-11 px-3 text-xs font-semibold"></select>
      <button onclick="saveAgentConfig()" class="w-full h-11 bg-orange-600 font-bold text-white rounded-xl text-xs cursor-pointer">Activer ce profil</button>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbysSqcdAtUIWYj9YUmxKTt2W9PvcsoLBig2SikCANNQL1Sr3wkn0qbNn9GYQugM1uje/exec";
    let currentAgent = localStorage.getItem("mob_current_agent") || "";
    let catalog = JSON.parse(localStorage.getItem("offline_catalog") || "[]");
    let availableAgents = JSON.parse(localStorage.getItem("offline_agents") || "[]");
    let cachedTournees = JSON.parse(localStorage.getItem("offline_tournees") || "[]");
    let sessionHistory = JSON.parse(localStorage.getItem("mob_session_history") || "[]");
    let pendingSyncQueue = JSON.parse(localStorage.getItem("offline_pending_sync") || "[]");
    let selectedArticle = null;

    document.addEventListener("DOMContentLoaded", async () => {
      lucide.createIcons();
      initMobileDropdowns();
      updatePendingBadge();
      if (!currentAgent) document.getElementById("configModal").classList.remove("hidden");
      else document.getElementById("headerAgentName").innerText = currentAgent;
      renderHistory();
      renderTournee();
      await syncMobileData();
    });

    function initMobileDropdowns() {
      const agentSel = document.getElementById("configAgentSelect");
      if (agentSel && availableAgents.length) agentSel.innerHTML = '<option value="">-- Choisir --</option>' + availableAgents.map(a => `<option value="${a}">${a}</option>`).join('');
      if (currentAgent && agentSel) agentSel.value = currentAgent;
      
      const cSel = document.getElementById("selectContractor");
      const tSel = document.getElementById("selectTrade");
      const contractors = JSON.parse(localStorage.getItem("offline_contractors") || "[]");
      const trades = JSON.parse(localStorage.getItem("offline_trades") || "[]");
      if (cSel) cSel.innerHTML = contractors.map(c => `<option value="${c}">${c}</option>`).join('');
      if (tSel) tSel.innerHTML = trades.map(t => `<option value="${t}">${t}</option>`).join('');
    }

    function openConfigModal() { document.getElementById("configModal").classList.remove("hidden"); }
    function saveAgentConfig() {
      const sel = document.getElementById("configAgentSelect").value;
      if (!sel) return;
      currentAgent = sel;
      localStorage.setItem("mob_current_agent", currentAgent);
      document.getElementById("headerAgentName").innerText = currentAgent;
      document.getElementById("configModal").classList.add("hidden");
      renderTournee();
      renderHistory();
    }
    function updatePendingBadge() {
      const badge = document.getElementById("pendingBadge");
      if (pendingSyncQueue.length) { badge.innerText = pendingSyncQueue.length; badge.classList.remove("hidden"); }
      else badge.classList.add("hidden");
    }

    function normalizeDateYMD(d) {
      if (!d) return "";
      if (d instanceof Date) return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const str = String(d).trim();
      const p = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
      if (p) return `${p[3]}-${p[2]}-${p[1]}`;
      return str.split('T')[0];
    }

    async function syncMobileData() {
      if (!navigator.onLine) return;
      const dot = document.getElementById("syncDot");
      dot.className = "w-2.5 h-2.5 rounded-full bg-amber-500 animate-spin";

      if (pendingSyncQueue.length) {
        for (const item of [...pendingSyncQueue]) {
          try {
            await fetch(GOOGLE_SCRIPT_URL, { method: "POST", body: JSON.stringify(item) });
            pendingSyncQueue = pendingSyncQueue.filter(q => q !== item);
            localStorage.setItem("offline_pending_sync", JSON.stringify(pendingSyncQueue));
          } catch (e) { break; }
        }
        updatePendingBadge();
      }

      try {
        const res = await fetch(`${GOOGLE_SCRIPT_URL}?t=${Date.now()}`);
        const data = await res.json();
        if (data.status === "success") {
          if (data.catalog) localStorage.setItem("offline_catalog", JSON.stringify(catalog = data.catalog));
          if (data.agents) localStorage.setItem("offline_agents", JSON.stringify(availableAgents = data.agents));
          if (data.contractors) localStorage.setItem("offline_contractors", JSON.stringify(data.contractors));
          if (data.trades) localStorage.setItem("offline_trades", JSON.stringify(data.trades));

          if (data.tournees) {
            const currentLocal = JSON.parse(localStorage.getItem("offline_tournees") || "[]");
            const localValides = new Set(currentLocal.filter(t => t.statut === 'VALIDE').map(t => `${t.agent}_${t.sapRef}`));
            cachedTournees = data.tournees.map(st => localValides.has(`${st.agent}_${st.sapRef}`) ? {...st, statut: 'VALIDE'} : st);
            localStorage.setItem("offline_tournees", JSON.stringify(cachedTournees));
          }

          if (data.history) {
            const activeAgentNorm = String(currentAgent || "").trim().toLowerCase();
            const serverAgentHistory = data.history.filter(h => String(h.user || "").trim().toLowerCase() === activeAgentNorm);
            localStorage.setItem("mob_session_history", JSON.stringify(serverAgentHistory));
            sessionHistory = serverAgentHistory;
          }

          initMobileDropdowns();
          renderTournee();
          renderHistory();
        }
      } catch (e) {} finally { dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"; }
    }

    function onSapSearchInput(q) {
      const dd = document.getElementById("sapSuggestions");
      const query = String(q||"").trim().toLowerCase();
      if (!query) { dd.classList.add("hidden"); return; }
      const filtered = catalog.filter(i => i.sapRef.toLowerCase().includes(query) || i.designation.toLowerCase().includes(query)).slice(0, 20);
      dd.innerHTML = filtered.map(i => `<div onclick='selectArticleFromSearch(${JSON.stringify(i)})' class="p-2 hover:bg-orange-50 cursor-pointer text-xs"><span class="font-bold text-orange-800">${i.sapRef}</span> - ${i.designation}</div>`).join('');
      dd.classList.remove("hidden");
    }

    function selectArticleFromSearch(i) {
      selectedArticle = i;
      document.getElementById("sapSearchInput").value = i.sapRef;
      document.getElementById("sapSuggestions").classList.add("hidden");
      document.getElementById("cardSapRef").innerText = i.sapRef;
      document.getElementById("cardDesignation").innerText = i.designation;
      document.getElementById("selectedArticleCard").classList.remove("hidden");
    }

    async function submitInventoryEntry() {
      if (!currentAgent) { alert("Configurez votre profil."); openConfigModal(); return; }
      if (!selectedArticle) { alert("Sélectionnez un article."); return; }

      const record = {
        id: "INV-" + Date.now().toString(36),
        timestamp: new Date().toISOString(),
        user: currentAgent,
        contractor: document.getElementById("selectContractor").value,
        trade: document.getElementById("selectTrade").value,
        sapRef: selectedArticle.sapRef,
        designation: selectedArticle.designation,
        quantity: parseInt(document.getElementById("inputQuantity").value, 10) || 0
      };

      sessionHistory.unshift(record);
      localStorage.setItem("mob_session_history", JSON.stringify(sessionHistory));

      let matchedId = null;
      cachedTournees.forEach(t => {
        if (t.agent === currentAgent && String(t.sapRef).trim() === String(selectedArticle.sapRef).trim()) {
          t.statut = 'VALIDE';
          matchedId = t.id;
        }
      });
      localStorage.setItem("offline_tournees", JSON.stringify(cachedTournees));

      pendingSyncQueue.push({ action: "CREATE", ...record });
      if (matchedId) pendingSyncQueue.push({ action: "UPDATE_TOURNEE_STATUS", id: matchedId, statut: 'VALIDE', user: currentAgent, sapRef: selectedArticle.sapRef });
      localStorage.setItem("offline_pending_sync", JSON.stringify(pendingSyncQueue));
      updatePendingBadge();

      resetComptageForm();
      renderHistory();
      renderTournee();
      switchMobileTab('historique');
      if (navigator.onLine) syncMobileData();
    }

    function resetComptageForm() {
      selectedArticle = null;
      document.getElementById("sapSearchInput").value = "";
      document.getElementById("selectedArticleCard").classList.add("hidden");
      document.getElementById("inputQuantity").value = "0";
    }

    function renderHistory() {
      const today = normalizeDateYMD(new Date());
      const list = sessionHistory.filter(h => h.user === currentAgent && normalizeDateYMD(h.timestamp) === today);
      document.getElementById("historyCount").innerText = list.length;
      document.getElementById("historyListContainer").innerHTML = list.length ? list.map(h => `
        <div class="bg-white border p-3 rounded-xl shadow-xs text-xs space-y-1">
          <div class="flex justify-between font-bold text-orange-800"><span>${h.sapRef}</span><span class="text-emerald-700">Qté: ${h.quantity}</span></div>
          <p class="truncate">${h.designation}</p>
        </div>
      `).join('') : '<div class="p-4 text-center text-slate-400 text-xs">Aucune saisie aujourd\'hui.</div>';
    }

    function renderTournee() {
      cachedTournees = JSON.parse(localStorage.getItem("offline_tournees") || "[]");
      const today = normalizeDateYMD(new Date());
      const list = cachedTournees.filter(t => t.agent === currentAgent && normalizeDateYMD(t.date) >= today);
      document.getElementById("tourneeListContainer").innerHTML = list.length ? list.map(t => {
        const isDone = String(t.statut).toUpperCase() === 'VALIDE';
        const clickAttr = isDone ? '' : `onclick="selectArticleFromTournee('${t.sapRef}')"`;
        const styleClass = isDone ? 'border-emerald-300 bg-emerald-50/60 opacity-90 cursor-default' : 'border-slate-200 hover:border-orange-300 cursor-pointer';
        return `
          <div ${clickAttr} class="bg-white border ${styleClass} p-3.5 rounded-2xl shadow-xs space-y-1">
            <div class="flex justify-between items-center text-xs font-bold">
              <span class="text-orange-800">${t.sapRef}</span>
              <span class="px-2 py-0.5 rounded text-[10px] ${isDone ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${isDone ? '✓ VALIDÉ' : 'À FAIRE'}</span>
            </div>
            <p class="text-xs truncate">${t.designation}</p>
          </div>
        `;
      }).join('') : '<div class="p-6 text-center text-slate-400 text-xs">Aucune tâche assignée.</div>';
    }

    function selectArticleFromTournee(sapRef) {
      const tourneeItem = cachedTournees.find(t => t.sapRef === sapRef && t.agent === currentAgent && t.statut !== 'VALIDE');
      if (tourneeItem) {
        if (tourneeItem.contractor) document.getElementById("selectContractor").value = tourneeItem.contractor;
        if (tourneeItem.trade) document.getElementById("selectTrade").value = tourneeItem.trade;
      }
      const item = catalog.find(i => i.sapRef === sapRef);
      if (item) { selectArticleFromSearch(item); switchMobileTab('comptage'); }
    }

    function switchMobileTab(tab) {
      ['Comptage', 'Historique', 'Tournee'].forEach(t => {
        document.getElementById("tab" + t).classList.add("hidden");
        document.getElementById("nav" + t).className = "flex flex-col items-center space-y-1 text-slate-400 font-bold text-[10px] cursor-pointer";
      });
      document.getElementById("tab" + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.remove("hidden");
      document.getElementById("nav" + tab.charAt(0).toUpperCase() + tab.slice(1)).className = "flex flex-col items-center space-y-1 text-orange-600 font-bold text-[10px] cursor-pointer";
      if (tab === 'historique') renderHistory();
      if (tab === 'tournee') renderTournee();
      lucide.createIcons();
    }
  </script>
</body>
</html>
