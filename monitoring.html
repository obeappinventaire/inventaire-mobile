<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supervision Inventaire - Monitoring Manager</title>
  <link rel="icon" type="image/png" href="app_icon_co2h2o.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { overscroll-behavior-y: none; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    #mapContainer { height: 580px; width: 100%; border-radius: 12px; z-index: 1; }
  </style>
</head>
<body class="h-full text-slate-800 flex flex-col font-sans select-none antialiased bg-slate-50">

  <header class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between shrink-0 shadow-sm z-20">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded-lg overflow-hidden border border-slate-200 bg-slate-50 flex items-center justify-center">
        <img src="app_icon_co2h2o.png" alt="Logo" class="w-6 h-6 object-contain">
      </div>
      <h1 class="text-sm font-bold text-slate-900 flex items-center gap-2">
        Dashboard Manager
        <span class="px-2 py-0.5 rounded bg-orange-50 text-orange-700 text-[10px] font-mono font-bold uppercase border border-orange-200">Supervision Centrale</span>
      </h1>
    </div>
    <div class="flex items-center space-x-4">
      <div class="flex items-center space-x-2">
        <div id="statusDot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
        <span id="statusText" class="text-xs font-bold text-emerald-600">Connecté</span>
      </div>
      <button onclick="syncMonitoringData()" class="p-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 cursor-pointer"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>
    </div>
  </header>

  <div class="flex-1 flex overflow-hidden">
    <aside class="w-72 bg-slate-800 border-r border-slate-700 flex flex-col justify-between shrink-0 text-slate-100 p-4 space-y-4">
      <div class="space-y-2">
        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block px-2 mb-2">Navigation</span>
        <button onclick="switchView('global')" id="btnNavGlobal" class="w-full flex items-center space-x-2 px-3 py-2.5 rounded-xl text-xs font-bold bg-orange-600 text-white cursor-pointer"><i data-lucide="bar-chart-2" class="w-4 h-4"></i><span>Activité Globale</span></button>
        <button onclick="switchView('agents')" id="btnNavAgents" class="w-full flex items-center space-x-2 px-3 py-2.5 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-700 cursor-pointer"><i data-lucide="users" class="w-4 h-4"></i><span>Suivi Agents</span></button>
        <button onclick="switchView('map')" id="btnNavMap" class="w-full flex items-center space-x-2 px-3 py-2.5 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-700 cursor-pointer"><i data-lucide="map" class="w-4 h-4"></i><span>Carte Géolocalisation</span></button>
        <button onclick="switchView('tournees')" id="btnNavTournees" class="w-full flex items-center space-x-2 px-3 py-2.5 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-700 cursor-pointer"><i data-lucide="calendar-range" class="w-4 h-4"></i><span>Agenda & Tournées</span></button>
      </div>
    </aside>

    <main class="flex-1 overflow-y-auto custom-scrollbar p-6 space-y-6 bg-slate-50">
      
      <section id="viewGlobal" class="space-y-6">
        <div class="grid grid-cols-4 gap-3">
          <div class="bg-white border p-4 rounded-xl shadow-xs"><span class="text-xs text-slate-500 block">Lignes</span><span id="kpiTotalRows" class="text-xl font-black">0</span></div>
          <div class="bg-white border p-4 rounded-xl shadow-xs"><span class="text-xs text-slate-500 block">Pièces</span><span id="kpiTotalPieces" class="text-xl font-black text-orange-600">0</span></div>
          <div class="bg-white border p-4 rounded-xl shadow-xs"><span class="text-xs text-slate-500 block">Ruptures</span><span id="kpiZeroStock" class="text-xl font-black text-rose-600">0</span></div>
          <div class="bg-white border p-4 rounded-xl shadow-xs"><span class="text-xs text-slate-500 block">Alertes</span><span id="kpiAtypicalStock" class="text-xl font-black text-amber-600">0</span></div>
        </div>
        <div class="bg-white border rounded-2xl p-4 shadow-xs">
          <table class="w-full text-left text-xs">
            <thead class="bg-slate-50 text-slate-500 uppercase font-bold border-b">
              <tr><th class="p-3">Date</th><th class="p-3">Agent</th><th class="p-3">Entrepreneur</th><th class="p-3">Métier</th><th class="p-3">Réf SAP</th><th class="p-3">Désignation</th><th class="p-3 text-center">Quantité</th><th class="p-3 text-right">Actions</th></tr>
            </thead>
            <tbody id="supervisionTableBody" class="divide-y"></tbody>
          </table>
        </div>
      </section>

      <section id="viewAgents" class="hidden space-y-6">
        <div id="agentsAccordionContainer" class="space-y-3"></div>
      </section>

      <section id="viewMap" class="hidden space-y-4">
        <div class="bg-white border p-2 rounded-2xl shadow-xs"><div id="mapContainer"></div></div>
      </section>

      <section id="viewTourneesAdmin" class="hidden space-y-6">
        <div class="flex items-center justify-between">
          <h3 class="text-sm font-bold uppercase tracking-wider">Planning Semaine & Tournées</h3>
          <button onclick="openManualAssignModal()" class="text-xs font-bold text-white bg-orange-600 hover:bg-orange-700 px-3.5 py-1.5 rounded-lg shadow-xs cursor-pointer">+ Nouvelle Tâche</button>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <div class="lg:col-span-8 bg-white border p-4 rounded-2xl shadow-xs">
            <div id="wallPlanningGrid" class="grid grid-cols-1 md:grid-cols-7 gap-2 min-h-[380px]"></div>
          </div>
          <div class="lg:col-span-4 bg-white border p-5 rounded-2xl shadow-xs space-y-4">
            <span class="text-xs font-bold uppercase tracking-wider">Complétion Globale</span>
            <span id="globalCompletionPct" class="text-2xl font-black text-orange-600 font-mono">0%</span>
            <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden"><div id="globalCompletionBar" class="bg-emerald-500 h-full w-0 transition-all"></div></div>
            <div id="agentCompletionList" class="space-y-2 max-h-[260px] overflow-y-auto"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="manualAssignModal" class="fixed inset-0 bg-slate-900/40 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-lg rounded-2xl p-5 shadow-2xl space-y-3">
      <h3 class="text-sm font-bold uppercase">Nouvelle Affectation de Tâche</h3>
      <div class="space-y-2 text-xs">
        <select id="adminAssignAgent" class="w-full border p-2 rounded-xl"><option value="">-- Agent --</option></select>
        <select id="adminAssignContractor" class="w-full border p-2 rounded-xl"><option value="">-- Entrepreneur --</option></select>
        <select id="adminAssignTrade" class="w-full border p-2 rounded-xl"><option value="">-- Métier --</option></select>
        <input type="date" id="adminAssignDate" class="w-full border p-2 rounded-xl">
        <select id="adminAssignTranche" class="w-full border p-2 rounded-xl"><option value="MATIN">Matin</option><option value="APRES_MIDI">Après-midi</option></select>
        <input type="text" id="adminCatalogSearch" oninput="renderAdminCatalogPicker(this.value)" placeholder="Recherche article SAP..." class="w-full border p-2 rounded-xl">
        <div id="adminCatalogPickerList" class="max-h-48 overflow-y-auto border p-2 rounded-xl"></div>
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="submitManualTourneeAssignment()" class="flex-1 bg-orange-600 text-white font-bold p-2 rounded-xl cursor-pointer">Enregistrer</button>
        <button onclick="closeManualAssignModal()" class="flex-1 bg-slate-100 p-2 rounded-xl cursor-pointer">Fermer</button>
      </div>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbysSqcdAtUIWYj9YUmxKTt2W9PvcsoLBig2SikCANNQL1Sr3wkn0qbNn9GYQugM1uje/exec";
    let cachedHistory = JSON.parse(localStorage.getItem("offline_history") || "[]");
    let cachedTournees = JSON.parse(localStorage.getItem("offline_tournees") || "[]");
    let catalog = JSON.parse(localStorage.getItem("offline_catalog") || "[]");
    let availableAgents = JSON.parse(localStorage.getItem("offline_agents") || "[]");
    let availableContractors = JSON.parse(localStorage.getItem("offline_contractors") || "[]");
    let availableTrades = JSON.parse(localStorage.getItem("offline_trades") || "[]");
    let manualSelectedCatalogSaps = [];
    let map = null, markersLayer = null;

    document.addEventListener("DOMContentLoaded", async () => {
      lucide.createIcons();
      applyFilters();
      await syncMonitoringData();
    });

    function normalizeDateYMD(dateVal) {
      if (!dateVal) return "";
      if (dateVal instanceof Date) {
        return `${dateVal.getFullYear()}-${String(dateVal.getMonth() + 1).padStart(2, '0')}-${String(dateVal.getDate()).padStart(2, '0')}`;
      }
      const str = String(dateVal).trim();
      const parts = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
      if (parts) {
        return `${parts[3]}-${String(parts[2]).padStart(2, '0')}-${String(parts[1]).padStart(2, '0')}`;
      }
      return str.split('T')[0];
    }

    function parseItemDate(str) {
      if (!str) return new Date(0);
      const parts = String(str).match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
      if (parts) return new Date(parts[3], parts[2] - 1, parts[1]);
      const iso = new Date(str);
      return isNaN(iso.getTime()) ? new Date(0) : iso;
    }

    async function syncMonitoringData() {
      try {
        const res = await fetch(`${GOOGLE_SCRIPT_URL}?t=${Date.now()}`);
        const data = await res.json();
        if (data.status === "success") {
          if (data.history) localStorage.setItem("offline_history", JSON.stringify(cachedHistory = data.history));
          if (data.tournees) localStorage.setItem("offline_tournees", JSON.stringify(cachedTournees = data.tournees));
          if (data.catalog) localStorage.setItem("offline_catalog", JSON.stringify(catalog = data.catalog));
          if (data.agents) localStorage.setItem("offline_agents", JSON.stringify(availableAgents = data.agents));
          if (data.contractors) localStorage.setItem("offline_contractors", JSON.stringify(availableContractors = data.contractors));
          if (data.trades) localStorage.setItem("offline_trades", JSON.stringify(availableTrades = data.trades));
          applyFilters();
          renderWallPlanning();
          renderAgentsView(cachedHistory);
        }
      } catch (err) { console.warn(err); }
    }

    function applyFilters() {
      renderKPIs(cachedHistory);
      renderTable(cachedHistory);
    }

    function renderKPIs(list) {
      document.getElementById("kpiTotalRows").innerText = list.length;
      document.getElementById("kpiTotalPieces").innerText = list.reduce((s, r) => s + (Number(r.quantity) || 0), 0);
      document.getElementById("kpiZeroStock").innerText = list.filter(r => Number(r.quantity) === 0).length;
      document.getElementById("kpiAtypicalStock").innerText = list.filter(r => Number(r.quantity) > 50).length;
    }

    function renderTable(list) {
      const tbody = document.getElementById("supervisionTableBody");
      if (list.length === 0) { tbody.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-slate-400">Aucune donnée.</td></tr>`; return; }
      tbody.innerHTML = list.map(item => `
        <tr class="hover:bg-slate-50 border-b">
          <td class="p-3 font-mono text-[11px]">${item.timestamp ? item.timestamp.split('T')[0] : ''}</td>
          <td class="p-3 font-bold">${item.user}</td>
          <td class="p-3">${item.contractor}</td>
          <td class="p-3">${item.trade}</td>
          <td class="p-3 font-mono text-amber-700">${item.sapRef}</td>
          <td class="p-3 truncate max-w-[200px]">${item.designation}</td>
          <td class="p-3 text-center font-mono font-black">${item.quantity}</td>
          <td class="p-3 text-right">
            <button onclick="editTableItem('${item.id}', ${item.quantity})" class="text-slate-600 mr-2"><i data-lucide="edit-3" class="w-4 h-4 inline"></i></button>
            <button onclick="deleteTableItem('${item.id}')" class="text-rose-600"><i data-lucide="trash-2" class="w-4 h-4 inline"></i></button>
          </td>
        </tr>
      `).join('');
      lucide.createIcons();
    }

    function renderAgentsView(list) {
      const container = document.getElementById("agentsAccordionContainer");
      if (!container) return;
      container.innerHTML = availableAgents.map(agent => {
        const records = list.filter(r => r.user === agent);
        return `
          <div class="bg-white border rounded-xl p-3 shadow-xs">
            <div class="flex justify-between font-bold text-xs"><span>${agent}</span><span>${records.length} saisie(s)</span></div>
          </div>
        `;
      }).join('');
    }

    function renderMap(list) {
      const mapDiv = document.getElementById("mapContainer");
      if (!mapDiv) return;
      if (!map) {
        map = L.map('mapContainer').setView([50.64, 4.67], 8);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        markersLayer = L.layerGroup().addTo(map);
      }
      markersLayer.clearLayers();
      list.filter(p => p.lat && p.lng).forEach(p => {
        L.circleMarker([p.lat, p.lng], { radius: 6, fillColor: "#f97316", color: "#fff", weight: 2, fillOpacity: 0.8 }).addTo(markersLayer);
      });
    }

    function resetMapToBelgium() { if (map) map.setView([50.64, 4.67], 8); }

    function exportTableToCSV() {
      if (cachedHistory.length === 0) { alert("Aucune donnée."); return; }
      const headers = ["ID", "Date", "Agent", "Entrepreneur", "Métier", "SAP", "Désignation", "Quantité"];
      const rows = cachedHistory.map(r => [r.id, r.timestamp, r.user, r.contractor, r.trade, r.sapRef, `"${r.designation}"`, r.quantity]);
      const csv = "\uFEFF" + [headers.join(";"), ...rows.map(e => e.join(";"))].join("\n");
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "export_inventaire.csv";
      link.click();
    }

    async function editTableItem(id, cur) {
      const val = prompt("Nouvelle quantité :", cur);
      if (val === null) return;
      const q = parseInt(val, 10);
      if (isNaN(q)) return;
      cachedHistory.forEach(h => { if (h.id === id) h.quantity = q; });
      applyFilters();
      await fetch(GOOGLE_SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "UPDATE_INVENTORY", id, quantity: q }) });
    }

    async function deleteTableItem(id) {
      if (!confirm("Supprimer ?")) return;
      cachedHistory = cachedHistory.filter(h => h.id !== id);
      applyFilters();
      await fetch(GOOGLE_SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "DELETE_INVENTORY", id }) });
    }

    function renderWallPlanning() {
      const grid = document.getElementById("wallPlanningGrid");
      if (!grid) return;
      const days = Array.from({length: 7}, (_, i) => {
        const d = new Date();
        d.setDate(d.getDate() - (d.getDay()||7) + 1 + i);
        return d;
      });
      const names = ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"];

      grid.innerHTML = days.map((d, i) => {
        const dStr = normalizeDateYMD(d);
        const tasks = (cachedTournees || []).filter(t => normalizeDateYMD(t.date) === dStr);
        const done = tasks.filter(t => String(t.statut).toUpperCase() === 'VALIDE').length;
        return `
          <div class="border rounded-xl p-2 bg-slate-50 space-y-2">
            <div class="text-center font-bold text-xs border-b pb-1">${names[i]} ${d.getDate()}</div>
            <div class="text-center text-[10px] bg-white p-1 rounded border">${done}/${tasks.length} validées</div>
          </div>
        `;
      }).join('');

      const total = cachedTournees.length;
      const doneTotal = cachedTournees.filter(t => String(t.statut).toUpperCase() === 'VALIDE').length;
      const pct = total > 0 ? Math.round((doneTotal / total) * 100) : 0;
      document.getElementById("globalCompletionPct").innerText = `${pct}%`;
      document.getElementById("globalCompletionBar").style.width = `${pct}%`;

      const agentList = document.getElementById("agentCompletionList");
      if (agentList) {
        agentList.innerHTML = availableAgents.map(agent => {
          const aTasks = cachedTournees.filter(t => t.agent === agent);
          const aDone = aTasks.filter(t => String(t.statut).toUpperCase() === 'VALIDE').length;
          return `<div class="text-xs flex justify-between"><span>${agent}</span><span class="font-bold">${aDone}/${aTasks.length}</span></div>`;
        }).join('');
      }
    }

    function switchView(v) {
      ['Global', 'Agents', 'Map', 'TourneesAdmin'].forEach(id => {
        const el = document.getElementById("view" + id);
        if (el) el.classList.add("hidden");
      });
      if (v === 'global') document.getElementById("viewGlobal").classList.remove("hidden");
      if (v === 'agents') { document.getElementById("viewAgents").classList.remove("hidden"); renderAgentsView(cachedHistory); }
      if (v === 'map') { document.getElementById("viewMap").classList.remove("hidden"); setTimeout(() => { if (map) { map.invalidateSize(); resetMapToBelgium(); } renderMap(cachedHistory); }, 100); }
      if (v === 'tournees') { document.getElementById("viewTourneesAdmin").classList.remove("hidden"); renderWallPlanning(); }
    }

    function openManualAssignModal() {
      document.getElementById("manualAssignModal").classList.remove("hidden");
      document.getElementById("adminAssignAgent").innerHTML = '<option value="">-- Agent --</option>' + availableAgents.map(a => `<option value="${a}">${a}</option>`).join('');
      document.getElementById("adminAssignContractor").innerHTML = '<option value="">-- Entrepreneur --</option>' + availableContractors.map(c => `<option value="${c}">${c}</option>`).join('');
      document.getElementById("adminAssignTrade").innerHTML = '<option value="">-- Métier --</option>' + availableTrades.map(t => `<option value="${t}">${t}</option>`).join('');
      document.getElementById("adminAssignDate").value = new Date().toISOString().split('T')[0];
    }
    function closeManualAssignModal() { document.getElementById("manualAssignModal").classList.add("hidden"); }

    function renderAdminCatalogPicker(q) {
      const list = document.getElementById("adminCatalogPickerList");
      const filtered = catalog.filter(i => i.sapRef.includes(q) || i.designation.toLowerCase().includes(q.toLowerCase()));
      list.innerHTML = filtered.slice(0, 20).map(i => `
        <label class="flex items-center gap-2 p-1 hover:bg-slate-100 cursor-pointer text-xs">
          <input type="checkbox" value="${i.sapRef}" onchange="manualSelectedCatalogSaps.includes('${i.sapRef}') ? manualSelectedCatalogSaps=manualSelectedCatalogSaps.filter(s=>s!='${i.sapRef}') : manualSelectedCatalogSaps.push('${i.sapRef}')">
          <span class="font-mono font-bold text-amber-700">${i.sapRef}</span><span>${i.designation}</span>
        </label>
      `).join('');
    }

    async function submitManualTourneeAssignment() {
      const agent = document.getElementById("adminAssignAgent").value;
      const contractor = document.getElementById("adminAssignContractor").value;
      const trade = document.getElementById("adminAssignTrade").value;
      const date = document.getElementById("adminAssignDate").value;
      const tranche = document.getElementById("adminAssignTranche").value;
      if (!agent || manualSelectedCatalogSaps.length === 0) { alert("Sélectionnez un agent et au moins un article."); return; }

      const items = manualSelectedCatalogSaps.map((sap, idx) => ({
        id: "TRN-" + Date.now().toString(36) + idx,
        agent, contractor, trade, sapRef: sap,
        designation: (catalog.find(i=>i.sapRef===sap)||{}).designation||'',
        ordre: idx+1, statut: 'A_FAIRE', date, tranche
      }));

      const res = await fetch(GOOGLE_SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "CREATE_TOURNEES_BULK", items }) });
      const data = await res.json();
      if (data.status === "success") {
        closeManualAssignModal();
        manualSelectedCatalogSaps = [];
        syncMonitoringData();
      } else {
        alert("Erreur : " + (data.message || "Échec"));
      }
    }
  </script>
</body>
</html>
